    // ===== 工具函数 =====
    /** 递归查找菜单项的完整路径（用于面包屑） */
    function findBreadcrumb(items, targetKey, path) {
      path = path || [];
      for (let i = 0; i < items.length; i++) {
        const item = items[i];
        const currentPath = path.concat([{ title: item.label, key: item.key }]);
        if (item.key === targetKey) return currentPath;
        if (item.children) {
          const result = findBreadcrumb(item.children, targetKey, currentPath);
          if (result) return result;
        }
      }
      return null;
    }

    /** 递归查找目标菜单项的所有父级 key（用于自动展开） */
    function findAllParentKeys(items, targetKey, parentKeys) {
      parentKeys = parentKeys || [];
      for (let i = 0; i < items.length; i++) {
        const item = items[i];
        if (item.key === targetKey) return parentKeys;
        if (item.children) {
          const result = findAllParentKeys(item.children, targetKey, parentKeys.concat([item.key]));
          if (result) return result;
        }
      }
      return null;
    }

    /** 递归查找目标菜单项（用于获取 icon） */
    function findMenuItem(items, targetKey) {
      for (let i = 0; i < items.length; i++) {
        const item = items[i];
        if (item.key === targetKey) return item;
        if (item.children) {
          const result = findMenuItem(item.children, targetKey);
          if (result) return result;
        }
      }
      return null;
    }

    function filterByKeyword(data, keyword, fields) {
      if (!keyword) return data;
      const kw = keyword.toLowerCase().trim();

    function useSearchableTable(initialData, searchFields) {
      const [searchText, setSearchText] = useState('');
      const [statusFilter, setStatusFilter] = useState(undefined);
      const [currentPage, setCurrentPage] = useState(1);
      const [pageSize, setPageSize] = useState(10);

      const filteredData = useMemo(() => {
        let result = filterByKeyword(initialData, searchText, searchFields);
        if (statusFilter) result = result.filter(item => item.status === statusFilter || item.flowStatus === statusFilter);
        return result;
      }, [initialData, searchText, statusFilter, searchFields]);

      const paginatedData = useMemo(() => {
        const start = (currentPage - 1) * pageSize;
        return filteredData.slice(start, start + pageSize);
      }, [filteredData, currentPage, pageSize]);

      const pagination = {
        ...standardPagination,
        total: filteredData.length,
        current: currentPage,
        pageSize: pageSize,
        onChange: (page, size) => { setCurrentPage(page); setPageSize(size); }

          {/* 查看详情弹框 */}
          <Modal

          >
            {detailRecord && (

                <Row gutter={[16, 16]}>

                  <Col span={12}><Text type="secondary">供应商类型：</Text><span>{detailRecord.type}</span></Col>

                  <Col span={12}><Text type="secondary">准入说明：</Text><span>{detailRecord.remark}</span></Col>
                  <Col span={12}><Text type="secondary">提交人：</Text><span>{detailRecord.submitter}</span></Col>

    // ===== 供应商类型组件 =====
    function SupplierType() {
      const [modalVisible, setModalVisible] = useState(false);
      const [modalMode, setModalMode] = useState('add'); // 'add' | 'edit'
      const [editRecord, setEditRecord] = useState(null);
      const [typeName, setTypeName] = useState('');
      const [qualRows, setQualRows] = useState([{ key: 1, certName: '', certType: '', expireDate: '' }]);

      const [tableData, setTableData] = useState([
        {
          key: '1', code: '202404070001', typeName: '信息服务供应商',
          quals: [
            { certName: 'ISO证书', certType: '行业资质', expireDate: '' },
            { certName: '著作权', certType: '专利著作权', expireDate: '' },
          ],
          submitter: '用户257522', submitTime: '2026-07-21 11:31:49', updateTime: ''
        },
        {
          key: '2', code: '202404070002', typeName: '原材料供应商',
          quals: [
            { certName: '生产资格证', certType: '行业资质', expireDate: '' },
            { certName: '人权认证', certType: '行业资质', expireDate: '' },
            { certName: '可持续发展认证', certType: '行业资质', expireDate: '' },
            { certName: '环评认证', certType: '安全证书', expireDate: '' },
            { certName: '排污许可证', certType: '安全证书', expireDate: '' },
          ],
          submitter: '用户257522', submitTime: '2026-07-21 11:31:49', updateTime: ''

      const addQualRow = () => {
        setQualRows(prev => [...prev, { key: prev.length + 1, certName: '', certType: '', expireDate: '' }]);

      // 新建
      const handleAdd = () => {
        setModalMode('add');
        setEditRecord(null);
        setTypeName('');
        setQualRows([{ key: 1, certName: '', certType: '', expireDate: '' }]);
        setModalVisible(true);
      };

      // 编辑
      const handleEdit = (record) => {
        setModalMode('edit');
        setEditRecord(record);
        setTypeName(record.typeName);
        setQualRows(record.quals.map((q, i) => ({ key: i + 1, certName: q.certName, certType: q.certType, expireDate: q.expireDate })));
        setModalVisible(true);

      // 删除
      const handleDelete = (record) => {
        Modal.confirm({
          title: '确认删除',
          content: `确定要删除供应商类型「${record.typeName}」吗？此操作不可恢复。`,
          okText: '确定',
          cancelText: '取消',
          okButtonProps: { danger: true },
          onOk: () => {
            setTableData(prev => prev.filter(item => item.key !== record.key));
            antd.message.success('删除成功');
          },
        });
      };

      // 提交/保存
      const handleSubmit = () => {
        if (!typeName.trim()) { antd.message.warning('请输入类型名称'); return; }
        if (modalMode === 'edit' && editRecord) {
          setTableData(prev => prev.map(item => item.key === editRecord.key ? { ...item, typeName, quals: qualRows.map(r => ({ certName: r.certName, certType: r.certType, expireDate: r.expireDate })), updateTime: new Date().toLocaleString('zh-CN', { hour12: false }).replace(/\//g, '-') } : item));
          antd.message.success('保存成功');
        } else {
          const newKey = String(tableData.length + 1);
          const newCode = '20240407000' + newKey;
          setTableData(prev => [...prev, { key: newKey, code: newCode, typeName, quals: qualRows.map(r => ({ certName: r.certName, certType: r.certType, expireDate: r.expireDate })), submitter: '用户257522', submitTime: new Date().toLocaleString('zh-CN', { hour12: false }).replace(/\//g, '-'), updateTime: '' }]);
          antd.message.success('提交成功');
        }
        setModalVisible(false);
      };

      const handleSaveDraft = () => {
        antd.message.success('草稿已保存');
        setModalVisible(false);
      };

      // 自定义渲染表格
      const renderTable = () => {
        const rows = [];
        tableData.forEach((item, idx) => {
          const rowSpan = item.quals.length + (idx === 1 ? 1 : 0); // 第二行加"加载更多"
          item.quals.forEach((q, qi) => {
            rows.push(
              <tr key={`${item.key}-${qi}`} style={{ borderBottom: '1px solid #f0f0f0' }}>

                {qi === 0 && <td rowSpan={rowSpan} style={{ padding: '8px 12px', verticalAlign: 'top', borderRight: '1px solid #f0f0f0' }}>{item.typeName}</td>}
                <td style={{ padding: '8px 12px', borderRight: '1px solid #f0f0f0' }}>{q.certName}</td>
                <td style={{ padding: '8px 12px', borderRight: '1px solid #f0f0f0' }}>{q.certType}</td>
                <td style={{ padding: '8px 12px', borderRight: '1px solid #f0f0f0' }}>{q.expireDate}</td>
                {qi === 0 && <td rowSpan={rowSpan} style={{ padding: '8px 12px', verticalAlign: 'top', borderRight: '1px solid #f0f0f0' }}><a style={{ color: '#1677ff' }}>{item.submitter}</a></td>}
                {qi === 0 && <td rowSpan={rowSpan} style={{ padding: '8px 12px', verticalAlign: 'top', borderRight: '1px solid #f0f0f0' }}>{item.submitTime}</td>}
                {qi === 0 && <td rowSpan={rowSpan} style={{ padding: '8px 12px', verticalAlign: 'top' }}>{item.updateTime}</td>}
                {qi === 0 && <td rowSpan={rowSpan} style={{ padding: '8px 12px', verticalAlign: 'top' }}><Space size={8}><a style={{ color: '#1677ff' }} onClick={() => handleEdit(item)}>编辑</a><a style={{ color: '#ff4d4f' }} onClick={() => handleDelete(item)}>删除</a></Space></td>}
              </tr>
            );
          });
          // 第二行加"加载更多"
          if (idx === 1) {
            rows.push(
              <tr key={`${item.key}-more`} style={{ borderBottom: '1px solid #f0f0f0' }}>
                <td style={{ padding: '8px 12px', borderRight: '1px solid #f0f0f0' }}><a style={{ color: '#1677ff' }}>加载更多</a></td>
                <td style={{ padding: '8px 12px', borderRight: '1px solid #f0f0f0' }}></td>
                <td style={{ padding: '8px 12px', borderRight: '1px solid #f0f0f0' }}></td>
                <td style={{ padding: '8px 12px' }}></td>
              </tr>
            );
          }
        });
        return rows;
      };

      const blueBtnStyle = { background: '#1677ff', borderColor: '#1677ff' };

      return (
        <div style={{ background: '#fff', borderRadius: 8, padding: '16px 24px' }}>
          {/* 工具栏 */}
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16 }}>
            <Space size={8}>
              <Button type="primary" style={blueBtnStyle} icon={React.createElement(PlusOutlined)} onClick={handleAdd}>新建</Button>
              <Button icon={React.createElement(ImportOutlined)}>导入</Button>
              <Button icon={React.createElement(ExportOutlined)}>导出</Button>
            </Space>
            <Space size={8}>
              <Select defaultValue="all" size="middle" style={{ width: 110 }}>
                <Option value="all">搜索范围</Option>
              </Select>
              <Input placeholder="请输入搜索内容" style={{ width: 220 }} suffix={React.createElement(SearchOutlined)} />
            </Space>
          </div>

          {/* 数据表格 */}
          <div style={{ border: '1px solid #f0f0f0', borderRadius: 4, overflow: 'auto' }}>
            <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 13 }}>
              <thead>
                <tr style={{ background: '#fafafa', borderBottom: '1px solid #f0f0f0' }}>
                  <th style={{ padding: '10px 12px', width: 40, textAlign: 'center', borderRight: '1px solid #f0f0f0' }}><input type="checkbox" /></th>
                  <th style={{ padding: '10px 12px', width: 140, textAlign: 'left', borderRight: '1px solid #f0f0f0' }}>ID</th>
                  <th style={{ padding: '10px 12px', width: 130, textAlign: 'left', borderRight: '1px solid #f0f0f0' }}>类型名称</th>
                  <th colSpan={3} style={{ padding: '10px 12px', textAlign: 'center', borderRight: '1px solid #f0f0f0' }}>资质要求</th>
                  <th style={{ padding: '10px 12px', width: 110, textAlign: 'left', borderRight: '1px solid #f0f0f0' }}>提交人</th>
                  <th style={{ padding: '10px 12px', width: 170, textAlign: 'left', borderRight: '1px solid #f0f0f0' }}>提交时间</th>
                  <th style={{ padding: '10px 12px', width: 120, textAlign: 'left', borderRight: '1px solid #f0f0f0' }}>更新时间</th>
                  <th style={{ padding: '10px 12px', width: 110, textAlign: 'left' }}>操作</th>
                </tr>
                <tr style={{ background: '#fafafa', borderBottom: '1px solid #f0f0f0' }}>
                  <th style={{ padding: '0', border: 'none' }}></th>
                  <th style={{ padding: '0', border: 'none' }}></th>
                  <th style={{ padding: '0', border: 'none' }}></th>
                  <th style={{ padding: '8px 12px', textAlign: 'left', borderRight: '1px solid #f0f0f0', fontWeight: 500 }}>证书名称</th>
                  <th style={{ padding: '8px 12px', textAlign: 'left', borderRight: '1px solid #f0f0f0', fontWeight: 500 }}>证书类型</th>
                  <th style={{ padding: '8px 12px', textAlign: 'left', borderRight: '1px solid #f0f0f0', fontWeight: 500 }}>到期日期</th>
                  <th style={{ padding: '0', border: 'none' }}></th>
                  <th style={{ padding: '0', border: 'none' }}></th>
                  <th style={{ padding: '0', border: 'none' }}></th>
                  <th style={{ padding: '0', border: 'none' }}></th>
                </tr>
              </thead>
              <tbody>
                {renderTable()}
              </tbody>
            </table>
          </div>

          {/* 底部分页 */}
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 12, paddingTop: 12, padding: '12px 0 8px', borderTop: '1px solid #f0f0f0' }}>
            <Space size={16}>
              {React.createElement(ColumnWidthOutlined, { style: { color: '#8c8c8c' } })}
              <Select defaultValue="20" size="small" style={{ width: 90 }}>
                <Option value="20">20条/页</Option>
                <Option value="50">50条/页</Option>
                <Option value="100">100条/页</Option>
              </Select>
              <span style={{ color: '#595959', fontSize: 13 }}>共 {tableData.length} 条</span>
            </Space>
            <Pagination current={1} total={tableData.length} pageSize={20} size="small" showSizeChanger={false} />
          </div>

          {/* 新建弹框 */}
          <Modal
            title={null}
            open={modalVisible}
            onCancel={() => setModalVisible(false)}
            footer={null}
            width={860}
            closable={false}
            bodyStyle={{ padding: 0 }}
            style={{ top: 20 }}
          >
            {/* 弹框头部 */}
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '16px 24px', borderBottom: '1px solid #f0f0f0' }}>
              <span style={{ fontSize: 16, fontWeight: 600 }}>{modalMode === 'edit' ? '编辑供应商类型' : '供应商类型'}</span>
              <Space size={16} style={{ color: '#8c8c8c', fontSize: 16 }}>
                {React.createElement(MessageOutlined, { style: { cursor: 'pointer' } })}
                {React.createElement(ExpandOutlined, { style: { cursor: 'pointer' } })}
                {React.createElement(CloseOutlined, { style: { cursor: 'pointer' }, onClick: () => setModalVisible(false) })}
              </Space>
            </div>

            {/* 弹框内容 */}
            <div style={{ padding: '20px 24px', minHeight: 400 }}>
              {/* 类型名称 */}
              <div style={{ marginBottom: 20 }}>
                <div style={{ marginBottom: 6, fontSize: 13, color: '#595959' }}>类型名称</div>
                <Input style={{ width: 380 }} value={typeName} onChange={(e) => setTypeName(e.target.value)} />
              </div>

              {/* 资质要求 */}
              <div style={{ marginBottom: 12 }}>
                <div style={{ marginBottom: 8, fontSize: 13, color: '#595959' }}>资质要求</div>
                <table style={{ width: '100%', borderCollapse: 'collapse', border: '1px solid #f0f0f0', fontSize: 13 }}>
                  <thead>
                    <tr style={{ background: '#fafafa' }}>
                      <th style={{ padding: '8px 12px', width: 50, textAlign: 'center', border: '1px solid #f0f0f0' }}>#</th>
                      <th style={{ padding: '8px 12px', textAlign: 'center', border: '1px solid #f0f0f0' }}>证书名称</th>
                      <th style={{ padding: '8px 12px', textAlign: 'center', border: '1px solid #f0f0f0' }}>证书类型</th>
                      <th style={{ padding: '8px 12px', textAlign: 'center', border: '1px solid #f0f0f0' }}>到期日期</th>
                    </tr>
                  </thead>
                  <tbody>
                    {qualRows.map((row, idx) => (
                      <tr key={row.key}>
                        <td style={{ padding: '8px 12px', textAlign: 'center', border: '1px solid #f0f0f0' }}>{idx + 1}</td>
                        <td style={{ padding: '4px 8px', border: '1px solid #f0f0f0' }}><Input size="small" value={row.certName} onChange={(e) => { const v = e.target.value; setQualRows(prev => prev.map(r => r.key === row.key ? { ...r, certName: v } : r)); }} /></td>
                        <td style={{ padding: '4px 8px', border: '1px solid #f0f0f0' }}><Select size="small" style={{ width: '100%' }} value={row.certType || undefined} placeholder="" allowClear onChange={(v) => { setQualRows(prev => prev.map(r => r.key === row.key ? { ...r, certType: v } : r)); }}><Option value="行业资质">行业资质</Option><Option value="安全证书">安全证书</Option><Option value="专利著作权">专利著作权</Option></Select></td>
                        <td style={{ padding: '4px 8px', border: '1px solid #f0f0f0' }}><Input size="small" value={row.expireDate} onChange={(e) => { const v = e.target.value; setQualRows(prev => prev.map(r => r.key === row.key ? { ...r, expireDate: v } : r)); }} /></td>
                      </tr>
                    ))}
                  </tbody>
                </table>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 8 }}>
                  <Space size={16}>
                    <a style={{ color: '#1677ff', fontSize: 13 }} onClick={addQualRow}>{React.createElement(PlusOutlined)} 添加</a>
                    <a style={{ color: '#1677ff', fontSize: 13 }}>{React.createElement(ImportOutlined)} 导入</a>
                    <a style={{ color: '#1677ff', fontSize: 13 }}>{React.createElement(EditOutlined)} 快速填报</a>
                  </Space>
                  <span style={{ color: '#8c8c8c', fontSize: 12 }}>{qualRows.length} / 200</span>
                </div>
              </div>
            </div>

            {/* 弹框底部 */}
            <div style={{ textAlign: 'center', padding: '12px 24px 20px', borderTop: '1px solid #f0f0f0' }}>
              <Space size={16}>
                <Button type="primary" style={{ ...blueBtnStyle, width: 100, height: 36 }} onClick={handleSubmit}>{modalMode === 'edit' ? '保存' : '提交'}</Button>
                <Button type="primary" style={{ background: '#52c41a', borderColor: '#52c41a', width: 100, height: 36 }} onClick={handleSaveDraft}>保存草稿</Button>
              </Space>
            </div>
          </Modal>
        </div>
      );
    }

    // ===== 供应商档案组件 =====
    function SupplierArchive() {
      const [selectedRowKeys, setSelectedRowKeys] = useState([]);
      const [detailVisible, setDetailVisible] = useState(false);
      const [detailRecord, setDetailRecord] = useState(null);
      const [editVisible, setEditVisible] = useState(false);
      const [editRecord, setEditRecord] = useState(null);
      const [editFormData, setEditFormData] = useState({});
      const [addVisible, setAddVisible] = useState(false);
      const [addFormData, setAddFormData] = useState({
        collabType: '协同供应商', type: '', name: '', creditCode: '', email: '',
        interSupplier: '', phone: '', interContact: '', contact: '', bizMode: '',
        materialLevel: '', supplierLevel: '', status: '', relation: '',
        purchaseHelper: '', bizScope: '',
        bank: '', accountName: '', accountNo: '', tel: '', address: '',
        riskLevel: '', selfRisk: 0, aroundRisk: 0, historyRisk: 0, warnRisk: 0
      });

      const handleAddChange = (field, value) => {
        setAddFormData(prev => ({ ...prev, [field]: value }));
      };

      const handleAddSubmit = () => {
        if (!addFormData.name || !addFormData.creditCode) { antd.message.warning('请填写供应商名称和统一社会信用代码'); return; }
        const newCode = generateDocNo('GYS');
        const newRecord = { ...addFormData, key: String(Date.now()), code: newCode, submitter: '管理员', submitTime: new Date().toLocaleString('zh-CN', { hour12: false }), updateTime: new Date().toLocaleString('zh-CN', { hour12: false }) };
        setTableData(prev => [newRecord, ...prev]);
        logAction('供应商档案', '新增', newCode, '新增供应商：' + addFormData.name);
        notify('success', '供应商新增成功', '供应商「' + addFormData.name + '」已创建，编号：' + newCode);
        antd.message.success('提交成功，编号：' + newCode);
        setAddVisible(false);
      };

      const handleAddSaveDraft = () => {
        antd.message.success('草稿已保存');
        setAddVisible(false);

      const chart1Ref = useRef(null);
      const chart2Ref = useRef(null);
      const chart3Ref = useRef(null);
      const chart4Ref = useRef(null);
      const chart5Ref = useRef(null);
      const chartsRef = useRef([]);

      useEffect(() => {
        const charts = [];
        // 寻源进度 - 饼图
        const c1 = echarts.init(chart1Ref.current);
        c1.setOption({
          tooltip: { trigger: 'item' },
          legend: { bottom: 0 },
          series: [{ type: 'pie', radius: ['0%', '65%'], center: ['50%', '45%'], label: { show: true, formatter: '{b} {c}' }, data: [
            { value: 32, name: '进行中', itemStyle: { color: '#e87c3e' } },
            { value: 14, name: '未开始', itemStyle: { color: '#f5c6a0' } },
            { value: 2, name: '已拆分', itemStyle: { color: '#fde8d0' } },
            { value: 40, name: '已完成', itemStyle: { color: '#c8a0a0' } },
            { value: 1, name: '转订单', itemStyle: { color: '#8b5e5e' } },
            { value: 11, name: '转合同', itemStyle: { color: '#d4b896' } },
          ] }]
        });
        charts.push(c1);
        // 月度寻源数 - 面积图
        const c2 = echarts.init(chart2Ref.current);
        c2.setOption({
          tooltip: { trigger: 'axis' },
          legend: { bottom: 0, data: ['需求池流水号'] },
          grid: { left: 40, right: 20, top: 30, bottom: 40 },
          xAxis: { type: 'category', data: ['2025年01月', '2025年03月', '2025年04月', '2025年06月', '2025年12月', '2026年01月'] },
          yAxis: { type: 'value' },
          series: [{ name: '需求池流水号', type: 'line', smooth: false, areaStyle: { color: 'rgba(232,124,62,0.3)' }, lineStyle: { color: '#e87c3e' }, itemStyle: { color: '#e87c3e' }, label: { show: true, position: 'top' }, data: [13, 1, 4, 5, 34, 43] }]
        });
        charts.push(c2);
        // 寻源方式 - 饼图
        const c3 = echarts.init(chart3Ref.current);
        c3.setOption({
          tooltip: { trigger: 'item' },
          legend: { bottom: 0 },
          series: [{ type: 'pie', radius: ['0%', '65%'], center: ['50%', '45%'], label: { show: true, formatter: '{b} {c}' }, data: [
            { value: 22, name: '单一来源采购', itemStyle: { color: '#e87c3e' } },
            { value: 14, name: '竞价', itemStyle: { color: '#f5c6a0' } },
            { value: 30, name: '询比价', itemStyle: { color: '#fde8d0' } },
            { value: 12, name: '已拆分', itemStyle: { color: '#c8a0a0' } },
            { value: 22, name: '招投标', itemStyle: { color: '#8b5e5e' } },
          ] }]
        });
        charts.push(c3);
        // 月度寻源金额 - 面积图
        const c4 = echarts.init(chart4Ref.current);
        c4.setOption({
          tooltip: { trigger: 'axis' },
          legend: { bottom: 0, data: ['含税金额'] },
          grid: { left: 100, right: 20, top: 30, bottom: 40 },
          xAxis: { type: 'category', data: ['2025年01月', '2025年03月', '2025年04月', '2025年06月', '2025年12月', '2026年01月'] },
          yAxis: { type: 'value', axisLabel: { formatter: (v) => v >= 1000000 ? (v/1000000).toFixed(0)+',000,000' : v.toLocaleString() } },
          series: [{ name: '含税金额', type: 'line', smooth: false, areaStyle: { color: 'rgba(232,124,62,0.3)' }, lineStyle: { color: '#e87c3e' }, itemStyle: { color: '#e87c3e' }, label: { show: true, position: 'top', formatter: (p) => p.value.toLocaleString(undefined, {minimumFractionDigits:2}) }, data: [8717045.64, 212000.00, 48018.00, 17677720.00, 39876201.64, 2346852.71] }]
        });
        charts.push(c4);
        // 寻源状态月度分析 - 折线图
        const c5 = echarts.init(chart5Ref.current);
        c5.setOption({
          tooltip: { trigger: 'axis' },
          legend: { bottom: 0, data: ['寻源发起'] },
          grid: { left: 40, right: 20, top: 30, bottom: 40 },
          xAxis: { type: 'category', data: ['2025年03月03日', '2025年06月09日', '2025年12月17日', '2025年12月23日', '2025年12月26日', '2025年12月28日', '2025年12月30日', '2026年01月06日', '2026年01月22日', '2026年01月29日'], axisLabel: { fontSize: 10 } },
          yAxis: { type: 'value' },
          series: [{ name: '寻源发起', type: 'line', smooth: true, lineStyle: { color: '#e87c3e' }, itemStyle: { color: '#e87c3e' }, label: { show: true, position: 'top' }, data: [13, 1, 4, 5, 0, 5, 5, 0, 5, 1, 7, 1, 2, 8, 8, 3, 5, 3, 12, 12].slice(0, 10) }]
        });
        charts.push(c5);
        chartsRef.current = charts;
        const handleResize = () => charts.forEach(c => c.resize());
        window.addEventListener('resize', handleResize);
        return () => { window.removeEventListener('resize', handleResize); charts.forEach(c => c.dispose()); };
      }, []);

      const cardStyle = { background: '#fff', borderRadius: 8, padding: '16px 20px', boxShadow: '0 1px 3px rgba(0,0,0,0.06)', border: '1px solid #f0f0f0' };

      return (
        <div style={{ background: '#f0f2f5', padding: 16, borderRadius: 8 }}>
          {/* 页面标题栏 */}
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16 }}>
            <span style={{ fontSize: 16, fontWeight: 600, color: '#e87c3e' }}>寻源统计看板</span>
            <Space size={16} style={{ color: '#8c8c8c', fontSize: 13 }}>
              <span style={{ cursor: 'pointer' }}>下载</span>
              <span style={{ cursor: 'pointer' }}>全屏</span>
              <span style={{ cursor: 'pointer' }}>编辑</span>
            </Space>
          </div>
          {/* 第一行图表 */}
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 2fr', gap: 12, marginBottom: 16 }}>
            <div style={{ ...cardStyle, minHeight: 340 }}>
              <div style={{ fontSize: 14, fontWeight: 500, marginBottom: 8 }}>寻源进度</div>
              <div ref={chart1Ref} style={{ width: '100%', height: 290 }}></div>
            </div>
            <div style={{ ...cardStyle, minHeight: 340 }}>
              <div style={{ fontSize: 14, fontWeight: 500, marginBottom: 8 }}>月度寻源数</div>
              <div ref={chart2Ref} style={{ width: '100%', height: 290 }}></div>
            </div>
          </div>
          {/* 第二行图表 */}
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 2fr', gap: 12, marginBottom: 16 }}>
            <div style={{ ...cardStyle, minHeight: 340 }}>
              <div style={{ fontSize: 14, fontWeight: 500, marginBottom: 8 }}>寻源方式</div>
              <div ref={chart3Ref} style={{ width: '100%', height: 290 }}></div>
            </div>
            <div style={{ ...cardStyle, minHeight: 340 }}>
              <div style={{ fontSize: 14, fontWeight: 500, marginBottom: 8 }}>月度寻源金额</div>
              <div ref={chart4Ref} style={{ width: '100%', height: 290 }}></div>
            </div>
          </div>
          {/* 第三行图表 */}
          <div style={cardStyle}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
              <span style={{ fontSize: 14, fontWeight: 500 }}>寻源状态月度分析</span>
              {React.createElement(InfoCircleOutlined, { style: { color: '#52c41a', cursor: 'pointer' } })}
            </div>
            <div ref={chart5Ref} style={{ width: '100%', height: 260 }}></div>
          </div>
        </div>
      );
    }

        { title: '当前负责人', dataIndex: 'currentOwner', width: 110 },
        { title: '操作', key: 'action', width: 150, fixed: 'right', render: (_, record) => React.createElement(Space, { size: 8 }, React.createElement('a', { style: { color: '#1677ff' }, onClick: () => handleViewDetail(record) }, '详情'), React.createElement('a', { style: { color: '#1677ff' }, onClick: () => handleEdit(record) }, '编辑'), React.createElement('a', { style: { color: '#ff4d4f' }, onClick: () => handleDelete(record) }, '删除')) },

                <Space size={16}>

    // ===== 合同比对组件 =====
    function ContractCompare() {
      const [contractA, setContractA] = useState(undefined);
      const [contractB, setContractB] = useState(undefined);
      const [compareResult, setCompareResult] = useState(null);

      const contractContents = {
        '1': '第一条 合同标的\n甲方：北京鲸采云科技有限公司\n乙方：上海易点科技有限公司\n采购商品：IT设备（服务器、交换机等）\n合同金额：¥455,000.00\n第二条 交货条款\n交货日期：2026年2月15日前\n交货地点：北京市海淀区中关村大街1号\n包装标准：原厂包装\n第三条 付款条款\n付款方式：银行转账\n30%预付 + 60%到货付 + 10%质保金\n第四条 质量保证\n质保期：12个月\n质保范围：非人为损坏免费维修\n第五条 违约责任\n每逾期一日按合同总金额的0.5%支付违约金\n逾期超过30日，甲方有权解除合同',
        '2': '第一条 合同标的\n甲方：北京鲸采云科技有限公司\n乙方：天津海叶商贸\n采购商品：制动盘（萨瓦尼尼282X23）\n合同金额：¥170,000.00\n第二条 交货条款\n交货日期：2026年2月20日前\n交货地点：天津市河西区\n包装标准：工业包装\n第三条 付款条款\n付款方式：银行转账\n100%到货验收后支付\n第四条 质量保证\n质保期：6个月\n质保范围：产品本身质量问题免费更换\n第五条 违约责任\n每逾期一日按合同总金额的0.3%支付违约金\n逾期超过15日，甲方有权解除合同',
      };

      const handleCompare = () => {
        if (!contractA || !contractB) { antd.message.warning('请选择两份合同'); return; }
        const linesA = contractContents[contractA].split('\n');
        const linesB = contractContents[contractB].split('\n');
        const maxLen = Math.max(linesA.length, linesB.length);
        const diffRows = [];
        for (let i = 0; i < maxLen; i++) {
          const a = linesA[i] || '';
          const b = linesB[i] || '';
          const same = a.trim() === b.trim();
          diffRows.push({ key: String(i), idx: i + 1, lineA: a, lineB: b, same });
        }
        setCompareResult(diffRows);
        logAction('合同比对', '执行比对', contractA + ' vs ' + contractB);
      };

      return (
        <div style={{ background: '#fff', borderRadius: 8, padding: '24px 32px' }}>
          <div style={{ fontSize: 16, fontWeight: 600, marginBottom: 20 }}>合同比对</div>
          <Row gutter={16} style={{ marginBottom: 20 }}>
            <Col span={10}><div style={{ fontSize: 13, color: '#595959', marginBottom: 4 }}>合同A</div><Select style={{ width: '100%' }} placeholder="选择合同" value={contractA} onChange={(v) => setContractA(v)} allowClear><Option value="1">HT20260129001 - 2026年度IT设备采购合同</Option><Option value="2">HT20260201002 - 制动盘采购框架协议</Option></Select></Col>
            <Col span={4} style={{ display: 'flex', alignItems: 'flex-end', justifyContent: 'center', paddingBottom: 4 }}><Button type="primary" onClick={handleCompare}>VS 比对</Button></Col>
            <Col span={10}><div style={{ fontSize: 13, color: '#595959', marginBottom: 4 }}>合同B</div><Select style={{ width: '100%' }} placeholder="选择合同" value={contractB} onChange={(v) => setContractB(v)} allowClear><Option value="1">HT20260129001 - 2026年度IT设备采购合同</Option><Option value="2">HT20260201002 - 制动盘采购框架协议</Option></Select></Col>
          </Row>
          {compareResult ? (
            <div style={{ border: '1px solid #f0f0f0', borderRadius: 8, overflow: 'hidden' }}>
              <div style={{ display: 'flex', background: '#fafafa', borderBottom: '1px solid #f0f0f0', fontWeight: 500, fontSize: 13 }}>
                <div style={{ flex: 1, padding: '8px 16px', borderRight: '1px solid #f0f0f0', color: '#1677ff' }}>合同A 内容</div>
                <div style={{ flex: 1, padding: '8px 16px', color: '#52c41a' }}>合同B 内容</div>
              </div>
              <div style={{ maxHeight: 500, overflowY: 'auto' }}>
                {compareResult.map(row => (
                  <div key={row.key} style={{ display: 'flex', borderBottom: '1px solid #f5f5f5', fontSize: 13, lineHeight: '24px' }}>
                    <div style={{ flex: 1, padding: '6px 16px', borderRight: '1px solid #f0f0f0', background: !row.lineA ? '#fff2f0' : row.same ? '#fff' : '#fffbe6' }}>
                      <span style={{ color: row.same ? '#262626' : '#faad14', whiteSpace: 'pre-wrap' }}>{row.lineA || React.createElement('span', { style: { color: '#bfbfbf' } }, '(空)')}</span>
                    </div>
                    <div style={{ flex: 1, padding: '6px 16px', background: !row.lineB ? '#fff2f0' : row.same ? '#fff' : '#f6ffed' }}>
                      <span style={{ color: row.same ? '#262626' : '#52c41a', whiteSpace: 'pre-wrap' }}>{row.lineB || React.createElement('span', { style: { color: '#bfbfbf' } }, '(空)')}</span>
                    </div>
                  </div>
                ))}
              </div>
              <div style={{ padding: '8px 16px', background: '#fafafa', borderTop: '1px solid #f0f0f0', fontSize: 12, color: '#8c8c8c', display: 'flex', gap: 16 }}>
                <span>差异行：{compareResult.filter(r => !r.same).length} / 总计：{compareResult.length}</span>
                <span style={{ color: '#faad14' }}>黄色=修改</span>
                <span style={{ color: '#ff4d4f' }}>红色=增删</span>
              </div>
            </div>
          ) : (
            <Row gutter={16}>
              <Col span={12}><div style={{ border: '1px solid #f0f0f0', borderRadius: 8, padding: 20, minHeight: 300, background: '#fafafa' }}><div style={{ fontSize: 14, fontWeight: 500, marginBottom: 12, color: '#1677ff' }}>合同A 内容</div><div style={{ color: '#8c8c8c' }}>选择合同后点击比对</div></div></Col>

            </Row>
          )}
        </div>
      );
    }

    // ===== 竞价大厅（供应商）组件 =====
    function BiddingHall() {
      const cardStyle = { background: '#fff', borderRadius: 12, border: '1px solid #f0f0f0', padding: '20px 24px', boxShadow: '0 2px 8px rgba(0,0,0,0.04)' };
      const [biddingVisible, setBiddingVisible] = useState(false);
      const [biddingItem, setBiddingItem] = useState(null);
      const [bidPrice, setBidPrice] = useState('');
      const [countdown, setCountdown] = useState(932);
      const [currentPrice, setCurrentPrice] = useState(98000);
      const [bidHistory, setBidHistory] = useState([
        { key: '1', time: '14:18:25', bidder: '供应商A', price: '100,000', rank: 3 },
        { key: '2', time: '14:19:10', bidder: '供应商B', price: '98,500', rank: 2 },
        { key: '3', time: '14:20:05', bidder: '供应商C', price: '98,000', rank: 1 },
      ]);
      const [myBidCount, setMyBidCount] = useState(2);

      useEffect(() => {
        let timer;
        if (biddingVisible && countdown > 0) {
          timer = setInterval(() => setCountdown(prev => prev > 1 ? prev - 1 : 0), 1000);
        } else if (countdown === 0 && biddingVisible) {
          notify('info', '竞价结束', 'IT设备竞价采购已结束，最终价：¥' + currentPrice.toLocaleString());
        }
        return () => clearInterval(timer);
      }, [biddingVisible, countdown, currentPrice]);

      const handleBid = () => {
        const price = parseFloat(bidPrice);
        if (!price || price <= 0) { antd.message.warning('请输入有效报价'); return; }
        if (price >= currentPrice) { antd.message.warning('报价必须低于当前价 ¥' + currentPrice.toLocaleString()); return; }
        const newHistory = [{ key: String(Date.now()), time: new Date().toLocaleTimeString('zh-CN', { hour12: false }), bidder: '我方', price: price.toLocaleString(), rank: 1 }, ...bidHistory];
        setBidHistory(newHistory);

        return findMenuItem(menuData, selectedKeys[0]);

      const handleMenuSelect = useCallback(({ key }) => {
        setSelectedKeys([key]);
        setHashKey(key);
        // 自动展开所有父级菜单
        const parentKeys = findAllParentKeys(menuData, key) || [];
        setOpenKeys((prev) => {
          const newKeys = [...prev];
          parentKeys.forEach((pk) => {
            if (!newKeys.includes(pk)) newKeys.push(pk);
          });
          return newKeys;
        });
      }, []);

      // 菜单展开/收起回调
      const handleOpenChange = useCallback((keys) => {
        setOpenKeys(keys);

      useEffect(() => {
        const onHashChange = () => {
          const key = getHashKey();
          setSelectedKeys([key]);
          const parentKeys = findAllParentKeys(menuData, key) || [];
          setOpenKeys(parentKeys);
        };
        window.addEventListener('hashchange', onHashChange);
        return () => window.removeEventListener('hashchange', onHashChange);

            label: item.label,
            icon: item.icon || null,

                ) : isSystemBom ? (
                  <SystemBom />
                ) : isSystemMaterialCategory ? (
                  <SystemMaterialCategory />
                ) : isSystemBidDeposit ? (
                  <SystemBidDepositStatus />
                ) : isSystemAddress ? (
                  <SystemAddress />
                ) : isSystemReviewPlan ? (
                  <SystemReviewPlan />
                ) : isSystemExchangeRate ? (
                  <SystemExchangeRate />
                ) : (
                  <div>
                    <div className="page-header">
                      <div className="page-icon">
                        {currentMenuItem && currentMenuItem.icon}
                      </div>
                      <div>
                        <h1 className="page-title">
                          {currentMenuItem ? currentMenuItem.label : "未知页面"}
                        </h1>
                        <p className="page-subtitle">
                          当前位置：
                          {breadcrumb.map((b) => b.title).join(" / ")}
                        </p>
                      </div>
                    </div>
                    <div style={{ padding: "0 8px" }}>
                      <Card
                        bordered={false}
                        style={{
                          background: "#fafafa",
                          borderRadius: 8,
                        }}
                      >
                        <div
                          style={{
                            display: "flex",
                            alignItems: "center",
                            justifyContent: "center",
                            minHeight: 200,
                            color: "#bfbfbf",
                            fontSize: 14,
                            flexDirection: "column",
                          }}
                        >
                          <Text type="secondary" style={{ fontSize: 16, marginBottom: 8 }}>
                            {currentMenuItem ? currentMenuItem.label : ""} - 内容区域
                          </Text>
                          <Text type="secondary" style={{ fontSize: 13 }}>
                            此页面为原型占位，可根据实际需求在此区域放置具体功能内容
                          </Text>
                        </div>
                      </Card>
                    </div>
                  </div>
                )}
              </div>
            </Content>
          </Layout>
        </Layout>
      );
    }

    // ===== 渲染到 DOM =====
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(React.createElement(App));
  </script>
</body>
</html>
