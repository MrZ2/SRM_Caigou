      font-size: 18px;
      font-weight: bold;

      color: #fff;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 1px;
      transition: opacity 0.2s;

      line-height: 64px;

    .header-left {
      display: flex;

    // ===== 工具函数 =====
    /** 递归查找菜单项的完整路径（用于面包屑） */
    function findBreadcrumb(items, targetKey, path) {
      path = path || [];
      for (let i = 0; i < items.length; i++) {
        const item = items[i];
        const currentPath = path.concat([{ title: item.label, key: item.key }]);
        if (item.key === targetKey) return currentPath;
        if (item.children) {
          const result = findBreadcrumb(item.children, targetKey, currentPath);
          if (result) return result;
        }
      }
      return null;
    }

    /** 递归查找目标菜单项的所有父级 key（用于自动展开） */
    function findAllParentKeys(items, targetKey, parentKeys) {
      parentKeys = parentKeys || [];
      for (let i = 0; i < items.length; i++) {
        const item = items[i];
        if (item.key === targetKey) return parentKeys;
        if (item.children) {
          const result = findAllParentKeys(item.children, targetKey, parentKeys.concat([item.key]));
          if (result) return result;
        }
      }
      return null;
    }

    /** 递归查找目标菜单项（用于获取 icon） */
    function findMenuItem(items, targetKey) {
      for (let i = 0; i < items.length; i++) {

        if (item.key === targetKey) return item;
        if (item.children) {
          const result = findMenuItem(item.children, targetKey);
          if (result) return result;
        }
      }
      return null;
    }

    // ===== 供应商类型组件 =====
    function SupplierType() {
      const [modalVisible, setModalVisible] = useState(false);
      const [modalMode, setModalMode] = useState('add'); // 'add' | 'edit'
      const [editRecord, setEditRecord] = useState(null);
      const [typeName, setTypeName] = useState('');
      const [qualRows, setQualRows] = useState([{ key: 1, certName: '', certType: '', expireDate: '' }]);

      const [tableData, setTableData] = useState([
        {
          key: '1', code: '202404070001', typeName: '信息服务供应商',
          quals: [
            { certName: 'ISO证书', certType: '行业资质', expireDate: '' },
            { certName: '著作权', certType: '专利著作权', expireDate: '' },
          ],
          submitter: '用户257522', submitTime: '2026-07-21 11:31:49', updateTime: ''
        },
        {
          key: '2', code: '202404070002', typeName: '原材料供应商',
          quals: [
            { certName: '生产资格证', certType: '行业资质', expireDate: '' },
            { certName: '人权认证', certType: '行业资质', expireDate: '' },
            { certName: '可持续发展认证', certType: '行业资质', expireDate: '' },
            { certName: '环评认证', certType: '安全证书', expireDate: '' },
            { certName: '排污许可证', certType: '安全证书', expireDate: '' },
          ],
          submitter: '用户257522', submitTime: '2026-07-21 11:31:49', updateTime: ''
        },
      ]);

      const addQualRow = () => {
        setQualRows(prev => [...prev, { key: prev.length + 1, certName: '', certType: '', expireDate: '' }]);
      };

      // 新建
      const handleAdd = () => {
        setModalMode('add');
        setEditRecord(null);
        setTypeName('');
        setQualRows([{ key: 1, certName: '', certType: '', expireDate: '' }]);
        setModalVisible(true);
      };

      // 编辑
      const handleEdit = (record) => {
        setModalMode('edit');
        setEditRecord(record);
        setTypeName(record.typeName);
        setQualRows(record.quals.map((q, i) => ({ key: i + 1, certName: q.certName, certType: q.certType, expireDate: q.expireDate })));
        setModalVisible(true);
      };

      // 删除
      const handleDelete = (record) => {
        Modal.confirm({
          title: '确认删除',
          content: `确定要删除供应商类型「${record.typeName}」吗？此操作不可恢复。`,
          okText: '确定',
          cancelText: '取消',
          okButtonProps: { danger: true },
          onOk: () => {
            setTableData(prev => prev.filter(item => item.key !== record.key));
            antd.message.success('删除成功');
          },
        });
      };

      // 提交/保存
      const handleSubmit = () => {
        if (!typeName.trim()) { antd.message.warning('请输入类型名称'); return; }
        if (modalMode === 'edit' && editRecord) {
          setTableData(prev => prev.map(item => item.key === editRecord.key ? { ...item, typeName, quals: qualRows.map(r => ({ certName: r.certName, certType: r.certType, expireDate: r.expireDate })), updateTime: new Date().toLocaleString('zh-CN', { hour12: false }).replace(/\//g, '-') } : item));
          antd.message.success('保存成功');
        } else {
          const newKey = String(tableData.length + 1);
          const newCode = '20240407000' + newKey;
          setTableData(prev => [...prev, { key: newKey, code: newCode, typeName, quals: qualRows.map(r => ({ certName: r.certName, certType: r.certType, expireDate: r.expireDate })), submitter: '用户257522', submitTime: new Date().toLocaleString('zh-CN', { hour12: false }).replace(/\//g, '-'), updateTime: '' }]);
          antd.message.success('提交成功');
        }
        setModalVisible(false);
      };

      const handleSaveDraft = () => {
        antd.message.success('草稿已保存');
        setModalVisible(false);
      };

      // 自定义渲染表格
      const renderTable = () => {
        const rows = [];
        tableData.forEach((item, idx) => {
          const rowSpan = item.quals.length + (idx === 1 ? 1 : 0); // 第二行加"加载更多"
          item.quals.forEach((q, qi) => {
            rows.push(
              <tr key={`${item.key}-${qi}`} style={{ borderBottom: '1px solid #f0f0f0' }}>
                {qi === 0 && <td rowSpan={rowSpan} style={{ padding: '8px 12px', textAlign: 'center', verticalAlign: 'top', borderRight: '1px solid #f0f0f0' }}><input type="checkbox" /></td>}
                {qi === 0 && <td rowSpan={rowSpan} style={{ padding: '8px 12px', verticalAlign: 'top', borderRight: '1px solid #f0f0f0' }}><a style={{ color: '#1677ff' }}>{item.code}</a></td>}
                {qi === 0 && <td rowSpan={rowSpan} style={{ padding: '8px 12px', verticalAlign: 'top', borderRight: '1px solid #f0f0f0' }}>{item.typeName}</td>}
                <td style={{ padding: '8px 12px', borderRight: '1px solid #f0f0f0' }}>{q.certName}</td>
                <td style={{ padding: '8px 12px', borderRight: '1px solid #f0f0f0' }}>{q.certType}</td>
                <td style={{ padding: '8px 12px', borderRight: '1px solid #f0f0f0' }}>{q.expireDate}</td>
                {qi === 0 && <td rowSpan={rowSpan} style={{ padding: '8px 12px', verticalAlign: 'top', borderRight: '1px solid #f0f0f0' }}><a style={{ color: '#1677ff' }}>{item.submitter}</a></td>}
                {qi === 0 && <td rowSpan={rowSpan} style={{ padding: '8px 12px', verticalAlign: 'top', borderRight: '1px solid #f0f0f0' }}>{item.submitTime}</td>}
                {qi === 0 && <td rowSpan={rowSpan} style={{ padding: '8px 12px', verticalAlign: 'top' }}>{item.updateTime}</td>}
                {qi === 0 && <td rowSpan={rowSpan} style={{ padding: '8px 12px', verticalAlign: 'top' }}><Space size={8}><a style={{ color: '#1677ff' }} onClick={() => handleEdit(item)}>编辑</a><a style={{ color: '#ff4d4f' }} onClick={() => handleDelete(item)}>删除</a></Space></td>}
              </tr>
            );
          });
          // 第二行加"加载更多"
          if (idx === 1) {
            rows.push(
              <tr key={`${item.key}-more`} style={{ borderBottom: '1px solid #f0f0f0' }}>
                <td style={{ padding: '8px 12px', borderRight: '1px solid #f0f0f0' }}><a style={{ color: '#1677ff' }}>加载更多</a></td>
                <td style={{ padding: '8px 12px', borderRight: '1px solid #f0f0f0' }}></td>
                <td style={{ padding: '8px 12px', borderRight: '1px solid #f0f0f0' }}></td>
                <td style={{ padding: '8px 12px' }}></td>
              </tr>
            );
          }
        });
        return rows;
      };

      const blueBtnStyle = { background: '#1677ff', borderColor: '#1677ff' };

    // ===== 供应商绩效看板组件 =====
    function QualityBoard() {
      const chart1Ref = useRef(null);
      const chart2Ref = useRef(null);
      const chart3Ref = useRef(null);
      const chartsRef = useRef([]);

      useEffect(() => {
        const charts = [];

        // 供应商交货及时率 - 纵向柱状图
        const c1 = echarts.init(chart1Ref.current);
        c1.setOption({
          tooltip: { trigger: 'axis', formatter: '{b}<br/>{a}: {c}%' },
          legend: { bottom: 0, data: ['及时率'] },
          grid: { left: 60, right: 20, top: 20, bottom: 40 },
          xAxis: { type: 'category', data: ['上海易点科技有限公司', '天津海叶商贸'], axisLabel: { fontSize: 11 } },
          yAxis: { type: 'value', max: 50, axisLabel: { formatter: '{value}.00%' } },
          series: [{
            name: '及时率', type: 'bar', barWidth: '40%',
            label: { show: true, position: 'top', formatter: '{c}%', fontSize: 12 },
            data: [
              { value: 33.33, itemStyle: { color: '#e87c3e' } },
              { value: 42.86, itemStyle: { color: '#c5a84a' } }
            ]
          }]
        });
        charts.push(c1);

        // 供应商质检合格率 - 横向柱状图
        const c2 = echarts.init(chart2Ref.current);
        c2.setOption({
          tooltip: { trigger: 'axis', formatter: '{b}<br/>{a}: {c}%' },
          legend: { bottom: 0, data: ['质检合格率'] },
          grid: { left: 180, right: 60, top: 10, bottom: 40 },
          xAxis: { type: 'value', max: 100, axisLabel: { formatter: '{value}.00%' } },
          yAxis: { type: 'category', data: ['制动盘采购', '汽车轮胎260123采购合同', '固定资产采购合同', '260123制动盘采购合同'].reverse(), axisLabel: { fontSize: 11 } },
          series: [{
            name: '质检合格率', type: 'bar', barWidth: '50%',
            label: { show: true, position: 'right', formatter: '{c}%', fontSize: 11 },
            itemStyle: { color: '#e87c3e' },
            data: [94.2979, 0, 0, 0].reverse()
          }]
        });
        charts.push(c2);

        // 商品合格率 - 横向柱状图（多色）
        const c3 = echarts.init(chart3Ref.current);
        c3.setOption({
          tooltip: { trigger: 'axis', formatter: '{b}<br/>{a}: {c}%' },
          legend: { bottom: 0, data: ['质检合格率'] },
          grid: { left: 80, right: 50, top: 10, bottom: 40 },
          xAxis: { type: 'value', max: 100, axisLabel: { formatter: '{value}.00%' } },
          yAxis: { type: 'category', data: ['刹车片', '汽车轮胎', '雷达传感器', '火花塞'], axisLabel: { fontSize: 11 } },
          series: [{
            name: '质检合格率', type: 'bar', barWidth: '50%',
            label: { show: true, position: 'right', formatter: '{c}', fontSize: 11 },
            data: [
              { value: 100, itemStyle: { color: '#c0392b' } },
              { value: 100, itemStyle: { color: '#c0392b' } },
              { value: 99.7, itemStyle: { color: '#e87c3e' } },
              { value: 99.8, itemStyle: { color: '#f0c040' } }
            ]
          }]
        });
        charts.push(c3);

        chartsRef.current = charts;
        const handleResize = () => charts.forEach(c => c.resize());
        window.addEventListener('resize', handleResize);
        return () => { window.removeEventListener('resize', handleResize); charts.forEach(c => c.dispose()); };
      }, []);

      const statCards = [
        { label: '考核供应商数', value: '2' },
        { label: '考核平均得分', value: '93.5' },
        { label: '质检合格率', value: '99.92%' },
        { label: '及时到货率', value: '38.46%' },
      ];

      const recordData = [
        { key: '1', date: '2025-12-01', code: 'GYS000008', name: '天津海叶商贸', plan: '供应商年度绩效考核', startDate: '2025-01-01', endDate: '2025-11-30', score: 87, level: 'B', status: '合格供应商' },
        { key: '2', date: '2025-12-02', code: 'GYS000005', name: '上海易点科技有限公司', plan: '供应商年度绩效考核', startDate: '2025-10-01', endDate: '2025-11-30', score: 100, level: 'A', status: '合格供应商' },
      ];

      const recordColumns = [
        { title: '考核日期', dataIndex: 'date', width: 110 },
        { title: '供应商编号', dataIndex: 'code', width: 120 },
        { title: '供应商名称', dataIndex: 'name', width: 160 },

        { title: '考核开始日期', dataIndex: 'startDate', width: 120 },
        { title: '考核结束日期', dataIndex: 'endDate', width: 120 },
        { title: '考核得分', dataIndex: 'score', width: 90, align: 'center' },
        { title: '考核等级', dataIndex: 'level', width: 90, align: 'center', render: (v) => React.createElement(Tag, { color: v === 'A' ? 'success' : v === 'B' ? 'processing' : 'default' }, v) },
        { title: '供应商状态', dataIndex: 'status', width: 110, render: (v) => React.createElement(Tag, { color: 'success' }, v) },
      ];

      const cardStyle = { background: '#fff', borderRadius: 8, padding: '16px 20px', boxShadow: '0 1px 3px rgba(0,0,0,0.06)', border: '1px solid #f0f0f0' };

      return (

          {/* 区域1：统计卡片 */}

                <div style={{ fontSize: 13, color: '#8c8c8c', marginBottom: 8 }}>{item.label}</div>
                <div style={{ fontSize: 36, fontWeight: 600, color: '#262626', letterSpacing: '-1px' }}>{item.value}</div>
              </div>
            ))}
          </div>

          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 12, marginBottom: 16 }}>
            <div style={{ ...cardStyle, minHeight: 320 }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
                <span style={{ fontSize: 14, fontWeight: 500 }}>供应商交货及时率</span>
                {React.createElement(ReloadOutlined, { style: { color: '#52c41a', cursor: 'pointer', fontSize: 14 } })}
              </div>
              <div ref={chart1Ref} style={{ width: '100%', height: 260 }}></div>
            </div>
            <div style={{ ...cardStyle, minHeight: 320 }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
                <span style={{ fontSize: 14, fontWeight: 500 }}>供应商质检合格率</span>
                <Space size={8} style={{ color: '#8c8c8c' }}>
                  {React.createElement(ReloadOutlined, { style: { cursor: 'pointer' } })}
                  {React.createElement(UnorderedListOutlined, { style: { cursor: 'pointer' } })}
                  {React.createElement(ExpandOutlined, { style: { cursor: 'pointer' } })}
                </Space>
              </div>
              <div ref={chart2Ref} style={{ width: '100%', height: 260 }}></div>
            </div>
            <div style={{ ...cardStyle, minHeight: 320 }}>
              <div style={{ fontSize: 14, fontWeight: 500, marginBottom: 8 }}>商品合格率</div>
              <div ref={chart3Ref} style={{ width: '100%', height: 260 }}></div>
            </div>
          </div>

          {/* 区域3：绩效考核记录 */}
          <div style={cardStyle}>
            <div style={{ fontSize: 14, fontWeight: 500, marginBottom: 12, paddingBottom: 12, borderBottom: '1px solid #f0f0f0' }}>绩效考核记录</div>
            <Table columns={recordColumns} dataSource={recordData} bordered size="small" pagination={false} scroll={{ x: 1080 }} />
          </div>
        </div>
      );
    }

    // ===== App 根组件 =====
    function App() {
      const [collapsed, setCollapsed] = useState(false);
      const [selectedKeys, setSelectedKeys] = useState([getHashKey()]);
      const [openKeys, setOpenKeys] = useState([]);

      // 面包屑路径
      const breadcrumb = useMemo(() => {
        return findBreadcrumb(menuData, selectedKeys[0]) || [];
      }, [selectedKeys]);

      // 当前选中的菜单项数据
      const currentMenuItem = useMemo(() => {
        return findMenuItem(menuData, selectedKeys[0]);
      }, [selectedKeys]);

      // 菜单选中回调
      const handleMenuSelect = useCallback(({ key }) => {
        setSelectedKeys([key]);
        setHashKey(key);
        // 自动展开所有父级菜单
        const parentKeys = findAllParentKeys(menuData, key) || [];
        setOpenKeys((prev) => {
          const newKeys = [...prev];
          parentKeys.forEach((pk) => {
            if (!newKeys.includes(pk)) newKeys.push(pk);
          });
          return newKeys;
        });
      }, []);

      // 菜单展开/收起回调
      const handleOpenChange = useCallback((keys) => {
        setOpenKeys(keys);
      }, []);

      // 监听浏览器前进/后退（hashchange）
      useEffect(() => {
        const onHashChange = () => {
          const key = getHashKey();
          setSelectedKeys([key]);
          const parentKeys = findAllParentKeys(menuData, key) || [];
          setOpenKeys(parentKeys);
        };
        window.addEventListener('hashchange', onHashChange);
        return () => window.removeEventListener('hashchange', onHashChange);
      }, []);

      // 初始化时自动展开当前页面对应的父级菜单
      useEffect(() => {
        const key = getHashKey();
        const parentKeys = findAllParentKeys(menuData, key) || [];
        if (parentKeys.length) setOpenKeys(parentKeys);
      }, []);

      // 构建 Menu 的 items 属性（递归处理）
      function buildMenuItems(data) {
        return data.map((item) => {
          const menuItem = {
            key: item.key,
            label: item.label,
            icon: item.icon || null,
          };
          if (item.children && item.children.length > 0) {
            menuItem.children = buildMenuItems(item.children);
          }
          return menuItem;
        });
      }

      const menuItems = useMemo(() => buildMenuItems(menuData), []);

      // 是否显示欢迎页
      const isHomePage = selectedKeys[0] === "home";
      // 是否显示供应商看板
      const isSupplierBoard = selectedKeys[0] === "supplier/board";
      // 是否显示供应商准入
      const isSupplierAccess = selectedKeys[0] === "supplier/access";
      // 是否显示供应商类型
      const isSupplierType = selectedKeys[0] === "supplier/type";
      // 是否显示供应商档案
      const isSupplierArchive = selectedKeys[0] === "supplier/archive";
      // 是否显示供应商注册
      const isSupplierRegister = selectedKeys[0] === "supplier/register";
      // 是否显示供应商绩效看板
      const isQualityBoard = selectedKeys[0] === "quality/board";

      return (
        <Layout style={{ minHeight: "100vh" }}>
          {/* ===== 侧边栏 ===== */}
          <Sider
            collapsible
            collapsed={collapsed}
            onCollapse={setCollapsed}
            width={250}
            theme="dark"
            trigger={null}
            style={{
              overflow: "hidden",
              display: "flex",
              flexDirection: "column",
              height: "100vh",
              boxShadow: "2px 0 8px rgba(0,0,0,0.08)",
            }}
          >
            {/* Logo */}
            <div className={"logo-wrapper" + (collapsed ? " logo-collapsed" : "")}>
              <div className="logo-icon">S</div>
              <span className="logo-text">SRM 采购管理系统</span>
            </div>

            {/* 菜单 */}
            <Menu
              className="sider-menu"
              theme="dark"
              mode="inline"
              selectedKeys={selectedKeys}
              openKeys={openKeys}
              onSelect={handleMenuSelect}
              onOpenChange={handleOpenChange}
              items={menuItems}
              inlineCollapsed={collapsed}
            />

            {/* 折叠触发器 */}
            <div
              onClick={() => setCollapsed(!collapsed)}
              style={{
                height: 40,
                display: "flex",
                alignItems: "center",
                justifyContent: "center",
                cursor: "pointer",
                borderTop: "1px solid rgba(255, 255, 255, 0.1)",
                color: "rgba(255, 255, 255, 0.65)",
                transition: "color 0.3s",
              }}
              onMouseEnter={(e) => (e.target.style.color = "#fff")}
              onMouseLeave={(e) => (e.target.style.color = "rgba(255, 255, 255, 0.65)")}
            >
              {collapsed
                ? React.createElement(MenuUnfoldOutlined, { style: { fontSize: 16 } })
                : React.createElement(MenuFoldOutlined, { style: { fontSize: 16 } })}
            </div>
          </Sider>

          {/* ===== 右侧主体 ===== */}
          <Layout>
            {/* Header */}
            <Header className="site-header">
              <div className="header-left">
                <span className="trigger" onClick={() => setCollapsed(!collapsed)}>
                  {collapsed
                    ? React.createElement(MenuUnfoldOutlined)
                    : React.createElement(MenuFoldOutlined)}
                </span>
              </div>
              <div className="header-right">
                <Space size={24}>
                  {/* 消息通知 */}
                  <Badge count={8} size="small">
                    {React.createElement(BellOutlined, {
                      style: { fontSize: 18, color: "#595959", cursor: "pointer" },
                    })}
                  </Badge>
                  {/* 用户头像下拉 */}
                  <Dropdown menu={{ items: userMenuItems }} placement="bottomRight">
                    <div className="user-avatar-dropdown">
                      <Avatar
                        size={32}
                        style={{ backgroundColor: "#1677ff" }}
                        icon={React.createElement(UserOutlined)}
                      />
                      <span className="user-name">管理员</span>
                    </div>
                  </Dropdown>
                </Space>
              </div>
            </Header>

            {/* Content */}
            <Content className="site-content">
              {/* 面包屑 */}
              {!isHomePage && !isSupplierBoard && !isSupplierAccess && !isSupplierType && !isSupplierArchive && !isSupplierRegister && !isQualityBoard && <Breadcrumb
                items={breadcrumb}
                style={{ marginBottom: 16 }}
              />}

              {/* 主内容卡片 */}
              <div className="content-card" style={(isHomePage || isSupplierBoard || isSupplierAccess || isSupplierType || isSupplierArchive || isSupplierRegister || isQualityBoard) ? { padding: 0, background: 'transparent', boxShadow: 'none' } : {}}>
                {isHomePage ? (
                  <HomeDashboard />
                ) : isSupplierBoard ? (
                  <SupplierBoard />
                ) : isSupplierAccess ? (
                  <SupplierAccess />
                ) : isSupplierType ? (
                  <SupplierType />
                ) : isSupplierArchive ? (
                  <SupplierArchive />
                ) : isSupplierRegister ? (
                  <SupplierRegister />
                ) : isQualityBoard ? (
                  <QualityBoard />
                ) : (
                  <div>
                    <div className="page-header">
                      <div className="page-icon">
                        {currentMenuItem && currentMenuItem.icon}
                      </div>
                      <div>
                        <h1 className="page-title">
                          {currentMenuItem ? currentMenuItem.label : "未知页面"}
                        </h1>
                        <p className="page-subtitle">
                          当前位置：
                          {breadcrumb.map((b) => b.title).join(" / ")}
                        </p>
                      </div>
                    </div>
                    <div style={{ padding: "0 8px" }}>
                      <Card
                        bordered={false}
                        style={{
                          background: "#fafafa",
                          borderRadius: 8,
                        }}
                      >
                        <div
                          style={{
                            display: "flex",
                            alignItems: "center",
                            justifyContent: "center",
                            minHeight: 200,
                            color: "#bfbfbf",
                            fontSize: 14,
                            flexDirection: "column",
                          }}
                        >
                          <Text type="secondary" style={{ fontSize: 16, marginBottom: 8 }}>
                            {currentMenuItem ? currentMenuItem.label : ""} - 内容区域
                          </Text>
                          <Text type="secondary" style={{ fontSize: 13 }}>
                            此页面为原型占位，可根据实际需求在此区域放置具体功能内容
                          </Text>
                        </div>
                      </Card>
                    </div>
                  </div>
                )}
              </div>
            </Content>
          </Layout>
        </Layout>
      );
    }

    // ===== 渲染到 DOM =====
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(React.createElement(App));
  </script>
</body>
</html>
