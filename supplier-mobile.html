<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>SRM 供应商端</title>
<style>
/* ================= 设计系统（自绘移动端组件，视觉口径沿用 Ant Design 企业级规范） ================= */
:root{
  --brand:#1677ff; --brand-press:#0958d9; --brand-soft:#e6f4ff;
  --bg:#f5f6f8; --card:#ffffff;
  --text:#1f2329; --text-2:#595959; --text-3:#8c8c8c; --text-4:#bfbfbf;
  --line:#f0f0f0; --line-2:#e5e7eb;
  --success:#52c41a; --success-soft:#f6ffed;
  --warning:#faad14; --warning-soft:#fffbe6;
  --error:#ff4d4f; --error-soft:#fff2f0;
  --processing:#1677ff; --processing-soft:#e6f4ff;
  --purple:#722ed1; --purple-soft:#f9f0ff;
  --cyan:#13c2c2; --cyan-soft:#e6fffb;
  --gold:#faad14; --volcano:#fa541c; --volcano-soft:#fff2e8;
  --r-lg:14px; --r-md:10px; --r-sm:8px;
  --shadow-card:0 1px 3px rgba(15,23,42,.05),0 4px 14px rgba(15,23,42,.04);
  --shadow-pop:0 8px 30px rgba(15,23,42,.16);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body,#root{height:100%}
/* #root 必须是 flex 列：否则 .page 的 flex:1 + overflow-y:auto 全部失效，
   页面不能内部滚动，超出手机框的内容（底部 TabBar、首页下半屏）在真机上根本点不到 */
#root{display:flex;flex-direction:column;min-height:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Segoe UI","Microsoft YaHei",sans-serif;background:#1d2129;color:var(--text);-webkit-font-smoothing:antialiased}
input,textarea,select,button{font-family:inherit;font-size:inherit;color:inherit;outline:none}
button{border:none;background:none;cursor:pointer}
a{color:var(--brand);text-decoration:none}
::-webkit-scrollbar{width:0;height:0}

/* ---------- 桌面端手机壳 ---------- */
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;padding:28px 16px;
  background:radial-gradient(1200px 600px at 20% 0%,#2b3245 0%,#1d2129 55%,#171a21 100%)}
.device{width:390px;height:min(844px,94vh);height:min(844px,94dvh);background:var(--bg);border-radius:44px;overflow:hidden;position:relative;
  box-shadow:0 0 0 11px #101319,0 0 0 13px #2c3340,0 30px 80px rgba(0,0,0,.55);display:flex;flex-direction:column}
.device.full{position:fixed;inset:0;width:100%;height:100%;border-radius:0;box-shadow:none;z-index:60}
.frame-toggle{position:fixed;top:18px;right:18px;z-index:70;background:rgba(255,255,255,.1);color:#e5e7eb;
  border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:8px 16px;font-size:13px;backdrop-filter:blur(8px)}
.frame-toggle:active{background:rgba(255,255,255,.2)}
.stage-hint{position:fixed;left:18px;top:18px;z-index:70;color:#8a93a6;font-size:12px;line-height:1.7;pointer-events:none}
.stage-hint b{color:#cdd3e0;font-size:14px;display:block}
@media (max-width:520px){
  .stage{padding:0;display:block}
  /* 真机：手机框贴住视口，TabBar 与安全区始终在屏内 */
  .device{position:fixed;inset:0;width:100%;height:100%;border-radius:0;box-shadow:none}
  .frame-toggle,.stage-hint{display:none}
}

/* ---------- 状态栏 / 顶栏 ---------- */
.statusbar{height:34px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 22px 0 26px;font-size:13px;font-weight:600;background:var(--topbar-bg,var(--card));color:var(--text);position:relative;z-index:5}
.statusbar .sb-icons{display:flex;align-items:center;gap:6px}
.sb-signal{display:flex;align-items:flex-end;gap:2px;height:11px}
.sb-signal i{width:3px;background:currentColor;border-radius:1px;display:block}
.sb-signal i:nth-child(1){height:4px}.sb-signal i:nth-child(2){height:6px}.sb-signal i:nth-child(3){height:8px}.sb-signal i:nth-child(4){height:10px}
.sb-batt{width:22px;height:11px;border:1.5px solid currentColor;border-radius:3px;position:relative;opacity:.85}
.sb-batt:after{content:'';position:absolute;inset:1.5px;background:currentColor;border-radius:1px;right:35%}
.sb-batt:before{content:'';position:absolute;right:-4px;top:2.5px;width:2px;height:4px;background:currentColor;border-radius:0 2px 2px 0}
.topbar{flex:none;height:46px;display:flex;align-items:center;background:var(--topbar-bg,var(--card));position:relative;z-index:5;border-bottom:.5px solid var(--line)}
.topbar .tb-back{width:46px;height:46px;display:flex;align-items:center;justify-content:center;flex:none}
.topbar .tb-back:active{opacity:.5}
.tb-chev{width:11px;height:11px;border-left:2.2px solid var(--text);border-bottom:2.2px solid var(--text);transform:rotate(45deg);border-radius:1px}
.topbar .tb-title{position:absolute;left:70px;right:70px;text-align:center;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .tb-right{margin-left:auto;padding-right:14px;font-size:13px;color:var(--brand);display:flex;align-items:center;gap:14px}
.id-watermark{flex:none;font-size:11px;color:var(--text-3);background:#f0f3f7;padding:5px 12px;text-align:center;line-height:1.4}
.id-watermark b{color:var(--text-2);font-weight:500}

/* ---------- 页面滚动区 ---------- */
.page{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:calc(12px + var(--safe-b))}
.page.has-tabbar{padding-bottom:calc(76px + var(--safe-b))}
.page.has-footer{padding-bottom:calc(84px + var(--safe-b))}
.page.has-tabbar.has-footer{padding-bottom:calc(150px + var(--safe-b))}

/* ---------- 底部 TabBar ---------- */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:calc(58px + var(--safe-b));padding-bottom:var(--safe-b);
  background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:.5px solid var(--line);display:flex;z-index:20}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--text-3);font-size:10.5px;position:relative}
.tab-item:active{opacity:.6}
.tab-item.on{color:var(--brand)}
.tab-item svg{width:23px;height:23px}
.tab-badge{position:absolute;top:4px;left:50%;margin-left:6px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--error);color:#fff;font-size:10px;line-height:16px;text-align:center;font-weight:600}

/* ---------- 卡片 ---------- */
.card{background:var(--card);border-radius:var(--r-lg);margin:10px 12px;padding:14px;box-shadow:var(--shadow-card)}
.card.press:active{transform:scale(.985);opacity:.92;transition:.08s}
.card-title{font-size:15px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.card-title .more{font-size:12px;color:var(--text-3);font-weight:400}
.row-between{display:flex;align-items:center;justify-content:space-between}
.muted{color:var(--text-3)} .muted2{color:var(--text-2)}
.fs11{font-size:11px}.fs12{font-size:12px}.fs13{font-size:13px}.fs14{font-size:14px}.fs15{font-size:15px}
.fw600{font-weight:600}
.mt4{margin-top:4px}.mt6{margin-top:6px}.mt8{margin-top:8px}.mt10{margin-top:10px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}

/* ---------- 标签 ---------- */
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font-size:11px;font-weight:500;white-space:nowrap}
.tag-default{background:#f5f5f5;color:#8c8c8c}
.tag-success{background:var(--success-soft);color:var(--success)}
.tag-warning{background:var(--warning-soft);color:#d48806}
.tag-error{background:var(--error-soft);color:var(--error)}
.tag-processing{background:var(--processing-soft);color:var(--processing)}
.tag-blue{background:var(--processing-soft);color:var(--processing)}
.tag-purple{background:var(--purple-soft);color:var(--purple)}
.tag-cyan{background:var(--cyan-soft);color:var(--cyan)}
.tag-gold{background:#fff7e6;color:#d46b08}
.tag-volcano{background:var(--volcano-soft);color:var(--volcano)}
.tag-orange{background:#fff7e6;color:#d46b08}

/* ---------- 分段 ---------- */
.seg{display:flex;background:#edeff2;border-radius:10px;padding:3px;margin:10px 12px 2px}
.seg-item{flex:1;height:32px;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--text-2);border-radius:8px;position:relative;gap:4px}
.seg-item.on{background:#fff;color:var(--text);font-weight:600;box-shadow:0 1px 4px rgba(15,23,42,.12)}
.seg-item .cnt{font-size:10px;background:var(--error);color:#fff;border-radius:7px;min-width:15px;height:15px;line-height:15px;padding:0 3px;text-align:center}
.seg-item.on .cnt{background:var(--brand)}

/* ---------- 按钮 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:48px;border-radius:12px;font-size:16px;font-weight:600;padding:0 20px;transition:.12s}
.btn-primary{background:linear-gradient(135deg,#3b8bff,#1677ff);color:#fff;box-shadow:0 6px 16px rgba(22,119,255,.28)}
.btn-primary:active{background:var(--brand-press);transform:scale(.98)}
.btn-ghost{background:#fff;color:var(--brand);border:1px solid #bcd6ff}
.btn-ghost:active{background:var(--brand-soft)}
.btn-danger{background:var(--error);color:#fff}
.btn-danger:active{background:#cf1322;transform:scale(.98)}
.btn-plain{background:#f2f4f7;color:var(--text-2)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-sm{height:34px;font-size:13px;border-radius:8px;padding:0 14px;font-weight:500}
.btn-xs{height:28px;font-size:12px;border-radius:7px;padding:0 10px;font-weight:500}
.footer-bar{position:absolute;left:0;right:0;bottom:0;padding:12px 14px calc(12px + var(--safe-b));background:rgba(255,255,255,.97);border-top:.5px solid var(--line);display:flex;gap:10px;z-index:15;backdrop-filter:blur(10px)}
.footer-bar .btn{flex:1}

/* ---------- 表单 ---------- */
.field{margin-bottom:14px}
.field-label{font-size:13px;color:var(--text-2);margin-bottom:7px;display:flex;align-items:center;gap:3px}
.field-label .req{color:var(--error)}
.input,textarea.input{width:100%;height:46px;border:1px solid var(--line-2);border-radius:10px;padding:0 13px;font-size:15px;background:#fff;transition:border-color .15s}
textarea.input{height:auto;min-height:88px;padding:10px 13px;resize:none;line-height:1.6}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(22,119,255,.12)}
.input[disabled],.input.ro{background:#f7f8fa;color:var(--text-2)}
.input.err{border-color:var(--error);box-shadow:0 0 0 3px rgba(255,77,79,.1)}
.field-err{font-size:12px;color:var(--error);margin-top:5px}
.select-fake{display:flex;align-items:center;justify-content:space-between}
.select-fake:after{content:'';width:8px;height:8px;border-right:1.8px solid var(--text-4);border-bottom:1.8px solid var(--text-4);transform:rotate(45deg) translateY(-2px)}
.input-wrap{position:relative}
.input-eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--text-4);font-size:12px;padding:4px}

/* ---------- 描述列表 ---------- */
.dl{display:flex;flex-wrap:wrap}
.dl-item{width:50%;padding:7px 0;font-size:13px}
.dl-item.full{width:100%}
.dl-label{color:var(--text-3);font-size:12px;margin-bottom:3px}
.dl-value{color:var(--text);word-break:break-all;line-height:1.5}

/* ---------- 空状态 / 提示条 ---------- */
.empty{padding:56px 0 44px;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--text-3);font-size:13px;text-align:center;line-height:1.7}
.notice-bar{display:flex;gap:8px;align-items:flex-start;border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.6;margin:10px 12px 0}
.notice-warn{background:var(--warning-soft);color:#ad6800}
.notice-err{background:var(--error-soft);color:#cf1322}
.notice-info{background:var(--processing-soft);color:#0958d9}
.notice-ok{background:var(--success-soft);color:#389e0d}

/* ---------- 时间线 ---------- */
.tl{padding:4px 0}
.tl-item{display:flex;gap:12px;position:relative;padding-bottom:20px}
.tl-item:last-child{padding-bottom:4px}
.tl-dot{width:10px;height:10px;border-radius:50%;background:var(--line-2);margin-top:5px;flex:none;position:relative;z-index:1}
.tl-item.done .tl-dot{background:var(--success)}
.tl-item.cur .tl-dot{background:var(--brand);box-shadow:0 0 0 4px rgba(22,119,255,.15)}
.tl-item.bad .tl-dot{background:var(--error)}
.tl-line{position:absolute;left:4.5px;top:16px;bottom:0;width:1px;background:var(--line-2)}
.tl-item:last-child .tl-line{display:none}
.tl-body{flex:1;font-size:13px}
.tl-body .t{font-weight:500}
.tl-body .d{color:var(--text-3);font-size:12px;margin-top:2px}

/* ---------- 底部弹层 / 确认框 / Toast ---------- */
.mask{position:absolute;inset:0;background:rgba(15,23,42,.5);z-index:40;animation:fadeIn .18s}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;z-index:41;animation:slideUp .22s cubic-bezier(.32,.72,.35,1);max-height:82%;display:flex;flex-direction:column}
.sheet-head{padding:14px 16px 10px;text-align:center;font-size:15px;font-weight:600;position:relative}
.sheet-close{position:absolute;right:12px;top:12px;width:30px;height:30px;color:var(--text-3);font-size:18px;display:flex;align-items:center;justify-content:center}
.sheet-body{overflow-y:auto;padding:0 16px calc(14px + var(--safe-b))}
.sheet-opt{height:52px;display:flex;align-items:center;justify-content:space-between;font-size:15px;border-bottom:.5px solid var(--line);padding:0 4px}
.sheet-opt:active{background:#f7f8fa}
.sheet-opt.sel{color:var(--brand);font-weight:600}
.sheet-cancel{margin-top:10px;height:50px;display:flex;align-items:center;justify-content:center;background:#f5f6f8;border-radius:12px;font-size:15px;color:var(--text-2)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(40%);opacity:.4}to{transform:translateY(0);opacity:1}}
.dialog{position:absolute;left:36px;right:36px;top:50%;transform:translateY(-50%);background:#fff;border-radius:16px;z-index:41;animation:popIn .18s;overflow:hidden}
@keyframes popIn{from{transform:translateY(-48%) scale(.94);opacity:0}to{transform:translateY(-50%) scale(1);opacity:1}}
.dialog-title{padding:20px 20px 6px;font-size:16px;font-weight:600;text-align:center}
.dialog-body{padding:6px 20px 18px;font-size:14px;color:var(--text-2);text-align:center;line-height:1.7}
.dialog-foot{display:flex;border-top:.5px solid var(--line)}
.dialog-foot button{flex:1;height:50px;font-size:15px;color:var(--text-2)}
.dialog-foot button.ok{color:var(--brand);font-weight:600;border-left:.5px solid var(--line)}
.dialog-foot button.ok.danger{color:var(--error)}
.dialog-foot button:active{background:#f7f8fa}
.toast{position:absolute;left:50%;top:16%;transform:translateX(-50%);z-index:90;background:rgba(20,24,32,.88);color:#fff;font-size:13.5px;padding:10px 18px;border-radius:10px;max-width:78%;text-align:center;line-height:1.6;animation:fadeIn .15s;box-shadow:var(--shadow-pop)}

/* ---------- 首页 ---------- */
.hero{background:linear-gradient(160deg,#0b3d91 0%,#1668dc 46%,#2f88ff 100%);padding:calc(10px + var(--safe-t)) 16px 58px;color:#fff;border-radius:0 0 26px 26px;position:relative}
.hero-name{font-size:19px;font-weight:700;display:flex;align-items:center;gap:8px}
.hero-sub{font-size:12px;opacity:.82;margin-top:5px}
.hero-bell{position:absolute;right:16px;top:calc(12px + var(--safe-t));width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center}
.hero-bell .dot{position:absolute;top:7px;right:8px;min-width:15px;height:15px;border-radius:8px;background:#ff4d4f;font-size:9.5px;color:#fff;display:flex;align-items:center;justify-content:center;padding:0 3px;font-weight:700}
.todo-grid{margin:-42px 12px 0;position:relative;z-index:2;background:#fff;border-radius:16px;box-shadow:0 8px 24px rgba(11,61,145,.14);padding:14px 6px 8px;display:flex;flex-wrap:wrap}
.todo-cell{width:33.33%;display:flex;flex-direction:column;align-items:center;padding:8px 0 12px;gap:4px}
.todo-cell:active{opacity:.6}
.todo-num{font-size:23px;font-weight:700;color:var(--brand);line-height:1.1}
.todo-num.zero{color:#d0d5dd}
.todo-label{font-size:12px;color:var(--text-2)}
.quick-grid{display:flex;flex-wrap:wrap;padding:4px 0}
.quick-cell{width:25%;display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 0 8px}
.quick-cell:active{opacity:.6}
.quick-ico{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:20px}
.quick-label{font-size:11.5px;color:var(--text-2)}

/* ---------- 业务卡片 ---------- */
.biz-card{background:#fff;border-radius:var(--r-lg);margin:10px 12px;padding:13px 14px;box-shadow:var(--shadow-card)}
.biz-card:active{background:#fafbfc}
.biz-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.biz-title{font-size:15px;font-weight:600;line-height:1.45;flex:1}
.biz-meta{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:12px;color:var(--text-3)}
.biz-meta b{color:var(--text-2);font-weight:500}
.biz-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:.5px dashed var(--line)}
.countdown{font-size:12.5px;font-weight:600;color:var(--text-2)}
.countdown.urgent{color:var(--error)}
.countdown.expired{color:var(--text-4)}
.money{font-weight:700;color:#d4380d;font-size:17px}
.money.big{font-size:22px}
.money.normal{color:var(--text)}
.rate-up{color:var(--error)} .rate-down{color:var(--success)}

/* ---------- 竞价间 ---------- */
.bid-hero{background:linear-gradient(160deg,#101827,#1b2b4a);margin:10px 12px;border-radius:16px;padding:18px 16px;color:#fff;text-align:center}
.bid-clock{font-size:44px;font-weight:800;letter-spacing:2px;font-variant-numeric:tabular-nums}
.bid-clock.urgent{color:#ff7875}
.bid-price{font-size:15px;opacity:.85;margin-top:6px}
.bid-price b{font-size:24px;color:#ffd666;font-weight:800;font-variant-numeric:tabular-nums}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:44px;height:44px;border-radius:12px;background:#f0f3f7;font-size:22px;color:var(--brand);font-weight:600}
.stepper button:active{background:#dbe7ff}
.stepper .input{text-align:center;font-size:17px;font-weight:700}

/* ---------- 徽标 / 其它 ---------- */
.dot-red{width:7px;height:7px;border-radius:50%;background:var(--error);display:inline-block;margin-left:5px;vertical-align:middle}
.sec-title{font-size:13px;font-weight:600;color:var(--text-3);margin:16px 16px 6px;letter-spacing:.5px}
.search-bar{margin:10px 12px 2px;display:flex;align-items:center;background:#fff;border-radius:10px;padding:0 12px;height:40px;box-shadow:var(--shadow-card);gap:8px}
.search-bar input{flex:1;border:none;font-size:14px;height:100%}
.search-bar svg{flex:none;color:var(--text-4)}
.chip-row{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:999px;background:#f2f4f7;font-size:12.5px;color:var(--text-2)}
.chip.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#3b8bff,#69b1ff);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700}
.menu-cell{display:flex;align-items:center;justify-content:space-between;padding:15px 2px;border-bottom:.5px solid var(--line);font-size:15px}
.menu-cell:active{opacity:.6}
.menu-cell:last-child{border-bottom:none}
.menu-cell .mc-l{display:flex;align-items:center;gap:12px}
.menu-cell .mc-ico{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px}
.mc-arrow{width:8px;height:8px;border-right:1.8px solid var(--text-4);border-top:1.8px solid var(--text-4);transform:rotate(45deg)}
.login-bg{min-height:100%;background:linear-gradient(170deg,#0b3d91 0%,#1668dc 38%,#f5f6f8 38.2%);display:flex;flex-direction:column}
</style>
</head>

function parseT(s){ const d=dayjs(s); return d.isValid()?d:null; }
/** 剩余时间：返回 {text, expired, urgent, ms} */
function leftInfo(target){
  const d=parseT(target); if(!d) return {text:'—',expired:false,urgent:false,ms:null};
  const ms=d.valueOf()-Date.now();
  if(ms<=0) return {text:'已截止',expired:true,urgent:false,ms};
  const m=Math.floor(ms/60000), h=Math.floor(m/60), dd=Math.floor(h/24);
  const text = dd>=1?('剩 '+dd+' 天 '+(h%24)+' 小时'): h>=1?('剩 '+h+' 小时 '+(m%60)+' 分') : ('剩 '+m+' 分 '+(Math.floor(ms/1000)%60)+' 秒');
  return {text, expired:false, urgent: ms<24*3600*1000, ms};
}
function clockText(ms){ if(ms==null||ms<=0) return '00:00'; const s=Math.ceil(ms/1000); const m=Math.floor(s/60); return pad2(m)+':'+pad2(s%60); }
/** 金额大写（与采购端报价大厅口径一致） */
function moneyCN(n){
  n=parseAmount(n); if(!n) return '零元整';
  const digits='零壹贰叁肆伍陆柒捌玖', units=['','拾','佰','仟'], big=['','万','亿'];
  let int=Math.floor(n), dec=Math.round((n-int)*100), s='';
  let bs=String(int), groups=[];
  while(bs.length>0){ groups.unshift(bs.slice(-4)); bs=bs.slice(0,-4); }
  groups.forEach((g,gi)=>{
    let part='', zero=false;
    for(let i=0;i<g.length;i++){ const d=+g[i], u=g.length-1-i;
      if(d===0){ zero=true; } else { if(zero) part+='零'; zero=false; part+=digits[d]+units[u]; } }
    if(part) s+=part+big[groups.length-1-gi];
  });
  s+='元';
  const j=Math.floor(dec/10), f=dec%10;
  if(j===0&&f===0) s+='整'; else { if(j) s+=digits[j]+'角'; if(f) s+=digits[f]+'分'; }
  return s;
}

/* ================= 共享数据仓（与采购端 index.html 同一个 localStorage 键） ================= */
const LS_KEY='srm-store-v1';
function readDump(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||'null'); }catch(e){ return null; } }
const store={};
function persistChannels(keys){
  try{
    const dump=readDump()||{};
    keys.forEach(k=>{ dump[k]=store[k]; });
    localStorage.setItem(LS_KEY, JSON.stringify(dump));
  }catch(e){}
}
function emitStore(){ try{ window.dispatchEvent(new CustomEvent('m-store')); }catch(e){} }
function setChannel(name,next){ store[name]=next; persistChannels([name]); emitStore(); }
function appendRow(name,row){ setChannel(name,[...(store[name]||[]),row]); }
function updateRow(name,key,patch){
  setChannel(name,(store[name]||[]).map(r=> r.key===key ? Object.assign({},r, typeof patch==='function'?patch(r):patch) : r));
}
function useChannel(name){
  const [tick,setTick]=useState(0);
  useEffect(()=>{ const h=()=>setTick(t=>t+1); window.addEventListener('m-store',h); return ()=>window.removeEventListener('m-store',h); },[name]);
  return store[name]||[];
}

    if(b.biddingNo==='JJ-DEMO-001'){
      const ed=parseT(b.endsAt);
      if(!ed || ed.valueOf() < Date.now()+60000){ b.endsAt=dayjs().add(8,'minute').format('YYYY-MM-DD HH:mm:ss'); b.status='竞价中'; dirty.add('biddings'); }
    } else if(b.status==='竞价中'){
      /* 历史种子里的「竞价中」实际早已过结束时间：归一为已结束，避免列表状态与倒计时打架 */
      const end=bidEndOf(b);
      if(end && parseT(end) && parseT(end).valueOf()<Date.now()){ b.status='已结束'; dirty.add('biddings'); }
    }
  });
  (store.tenders||[]).forEach(function(t){
    if(t.tenderNo==='TB-DEMO-001'){
      const dl=parseT(t.bidDeadline);
      if(!dl || dl.valueOf() < Date.now()+30*60000){ t.bidDeadline=dOffset(3,17); t.status='投标中'; dirty.add('tenders'); }
    }
  });
  /* 演示合同（待回签）补齐：老数据里没有时也补一条，保证合同回签可演示 */
  if(!(store.contracts||[]).some(function(c){ return c.code==='HT-DEMO-001'; })){
    const seed=SEED.contracts.find(function(c){ return c.code==='HT-DEMO-001'; });
    if(seed){ store.contracts=[seed].concat(store.contracts||[]); dirty.add('contracts'); }
  }
  if(dirty.size) persistChannels(Array.from(dirty));
})();

function parseHash(){
  const h=(window.location.hash||'#/m/home').replace(/^#/,'');
  const qi=h.indexOf('?'); const path=qi>=0?h.slice(0,qi):h;
  const params={};
  if(qi>=0) h.slice(qi+1).split('&').forEach(function(kv){ const p=kv.split('='); params[decodeURIComponent(p[0])]=decodeURIComponent(p[1]||''); });
  return { path:path, params:params };
}
function nav(path){ window.location.hash='#'+path; }
function useRoute(){
  const [r,setR]=useState(parseHash());
  useEffect(()=>{ const h=()=>setR(parseHash()); window.addEventListener('hashchange',h); return ()=>window.removeEventListener('hashchange',h); },[]);
  return r;
}

function Login(){
  const [phone,setPhone]=useState(''); const [pwd,setPwd]=useState(''); const [showPwd,setShowPwd]=useState(false);
  const [remember,setRemember]=useState(true);
  const [errPhone,setErrPhone]=useState(''); const [errPwd,setErrPwd]=useState('');
  const [fails,setFails]=useState(0); const [lockUntil,setLockUntil]=useState(0);
  const [,tick]=useState(0);
  useEffect(()=>{ const t=setInterval(function(){ tick(x=>x+1); },1000); return ()=>clearInterval(t); },[]);
  const locked=Date.now()<lockUntil;
  const lockSec=Math.max(0,Math.ceil((lockUntil-Date.now())/1000));
  function doLogin(){
    setErrPhone(''); setErrPwd('');
    if(locked) return;
    if(!phone){ setErrPhone('请输入手机号'); return; }
    if(!pwd){ setErrPwd('请输入密码'); return; }
    if(!/^1\d{10}$/.test(phone) && !/^GYS\d{6}$/.test(phone)){ setErrPhone('手机号应为 11 位（或供应商编码 GYS******）'); return; }
    const acc=(store.mAccounts||[]).find(function(a){ return a.phone===phone || a.supplierCode===phone.toUpperCase(); });
    if(!acc || acc.password!==pwd){
      const n=fails+1; setFails(n);
      if(n>=5){ setLockUntil(Date.now()+30000); setFails(0); toast('错误次数过多，请 30 秒后重试'); }
      else toast('账号或密码错误');
      return;
    }
    enterApp(acc, acc.supplierName+' 登录供应商手机端');
  }
  /* 演示账号：点一下即以该身份登录（同时回填账号密码，便于看出用的是哪个账号） */
  function quickLogin(acc){
    if(locked){ toast('请 '+lockSec+' 秒后再试'); return; }
    setPhone(acc.phone); setPwd(acc.password); setErrPhone(''); setErrPwd('');
    enterApp(acc, acc.supplierName+' 通过演示账号登录');
  }
  /* 登录后进首页：任何一步异常都不允许变成「点了没反应」——先切身份与页面，日志失败不影响登录 */
  function enterApp(acc, logText){
    try{
      setSession({ supplierCode:acc.supplierCode, supplierName:acc.supplierName, contact:acc.contact, loginTime:nowStr() }, remember);
      nav('/m/home'); notifyAuth();
      toast('欢迎，'+acc.supplierName);
      try{ logAction('手机端','登录','',logText); }catch(e){}
    }catch(e){
      try{ (window.__errs=window.__errs||[]).push('登录异常：'+(e&&e.message)); }catch(_){}
      toast('登录异常：'+(e&&e.message||e));
    }
  }
  return (<div className="page login-bg">
    <div style={{padding:'52px 32px 0',color:'#fff'}}>
      <div style={{width:56,height:56,borderRadius:16,background:'rgba(255,255,255,.16)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:26,fontWeight:800,backdropFilter:'blur(4px)'}}>S</div>
      <div style={{fontSize:24,fontWeight:700,marginTop:16}}>SRM 供应商协同平台</div>
      <div style={{fontSize:13,opacity:.85,marginTop:6}}>询价报价 · 竞价招标 · 订单交付 · 对账结算</div>
    </div>
    <div className="card" style={{margin:'36px 16px 0',padding:'22px 18px'}}>
      <div className="field">
        <div className="field-label">手机号 / 供应商编码 <span className="req">*</span></div>
        <input className={'input'+(errPhone?' err':'')} inputMode="tel" placeholder="请输入 11 位手机号" value={phone} onChange={function(e){ setPhone(e.target.value); setErrPhone(''); }}/>
        {errPhone? <div className="field-err">{errPhone}</div> : null}
      </div>
      <div className="field">
        <div className="field-label">密码 <span className="req">*</span></div>
        <div className="input-wrap">
          <input className={'input'+(errPwd?' err':'')} type={showPwd?'text':'password'} placeholder="请输入密码" value={pwd}
            onChange={function(e){ setPwd(e.target.value); setErrPwd(''); }}
            onKeyDown={function(e){ if(e.key==='Enter') doLogin(); }}/>
          <span className="input-eye" onClick={function(){ setShowPwd(!showPwd); }}>{showPwd?'隐藏':'显示'}</span>
        </div>
        {errPwd? <div className="field-err">{errPwd}</div> : null}
      </div>

/* ================= 询价域公共函数 ================= */
function myInquiryRows(){ const m=me(); if(!m) return []; return (store.inquiries||[]).filter(function(q){ return (q.invited||[]).indexOf(m.supplierCode)>=0; }); }
function myQuoteRows(inquiryNo){ const m=me(); return (store.quotes||[]).filter(function(q){ return q.inquiryNo===inquiryNo && q.supplierCode===m.supplierCode; }); }
function mySignupOf(docNo){ const m=me(); return (store.signups||[]).find(function(s){ return s.docNo===docNo && s.supplierCode===m.supplierCode; }); }
/* 我在某询价单上的规范状态（口径与采购端 QUOTE_STATUS_ALIAS 一致） */
function myQuoteState(q){
  if(!q) return '未报价';
  if(q.inquiryStatus==='已完成'||q.inquiryStatus==='已结束') return '已结束';
  const rows=myQuoteRows(q.applyNo).filter(function(r){ return r.quoteStatus!=='已撤回'; });
  const active=rows.filter(function(r){ return r.quoteStatus==='已报价'; });
  if(active.length) return '已报价';
  const rejected=rows.filter(function(r){ return r.quoteStatus==='已驳回'; });
  const li=leftInfo(q.round1Deadline);
  if(rejected.length) return li.expired?'已结束':'已驳回';
  const withdrawn=myQuoteRows(q.applyNo).filter(function(r){ return r.quoteStatus==='已撤回'; });
  if(withdrawn.length && li.expired) return '已撤回';
  if(li.expired) return rows.length?'已结束':'逾期';
  return withdrawn.length?'已撤回':'未报价';
}
/* 可报价判据：已生效 + 未报价/已驳回 + 未截止 +（需报名则已通过） */
function canQuoteInquiry(q){
  if(!q) return { ok:false, reason:'无报价单' };
  if(q.flowStatus && q.flowStatus!=='已生效') return { ok:false, reason:'报价单'+q.flowStatus };
  const st=myQuoteState(q);
  if(st==='已报价') return { ok:false, reason:'当前状态：已报价' };
  if(st==='已结束'||st==='逾期') return { ok:false, reason:'已截止' };
  const li=leftInfo(q.round1Deadline);
  if(li.expired) return { ok:false, reason:'已截止' };
  if(q.needSignup==='是'){ const su=mySignupOf(q.applyNo); if(!su || su.status!=='已通过') return { ok:false, reason:'需先报名' }; }
  return { ok:true, reason:'' };
}
function isQuotableState(st){ return st==='未报价'||st==='已驳回'||st==='已撤回'; }
function todoCounts(){
  const m=me(); const empty={quote:0,bidding:0,order:0,recon:0,deposit:0,pub:0};
  if(!m) return empty;
  const code=m.supplierCode, name=m.supplierName;
  return {
    quote: myInquiryRows().filter(function(q){ return isQuotableState(myQuoteState(q)); }).length,
    bidding: (store.biddings||[]).filter(function(b){ return b.status==='竞价中' && (b.suppliers||[]).indexOf(name)>=0; }).length,
    order: (store.orders||[]).filter(function(o){ return o.supplier===name && o.status==='待供应商确认'; }).length,
    recon: (store.reconciliations||[]).filter(function(r){ return r.supplier===name && r.status==='待确认'; }).length,
    deposit: (store.deposits||[]).filter(function(d){ return d.supplierCode===code && d.payStatus==='待缴纳'; }).length,
    pub: (store.publicities||[]).filter(function(p){ return p.status==='公示中'; }).length,
  };
}

        <FieldRow label="需先报名" value={q.needSignup}/>
        <FieldRow label="发票类型" value={q.invoiceType}/>
        <FieldRow label="付款方式" value={q.paymentMethod}/>
      </div>
      {(q.paymentTerms||[]).length? <div className="mt8"><div className="dl-label">付款条件</div>{q.paymentTerms.map(function(p,i){ return <div key={i} className="fs13 mt4">{i+1}. {p.condition}</div>; })}</div> : null}
      {q.sealedQuote==='是'? <div className="notice-bar notice-info" style={{margin:'10px 0 0'}}><span>🔒</span><span>本项目为密封报价：截止开标前，采购方与其他供应商均不可查看你的报价内容。</span></div> : null}
      {q.needSignup==='是'? <div className="notice-bar notice-warn" style={{margin:'10px 0 0'}}><span>!</span><span>本单需先报名并通过审核才可报价。我的报名状态：{su? su.status : '未报名'}{su&&su.status==='已拒绝'&&su.rejectReason?('（'+su.rejectReason+'）'):''}</span></div> : null}

/* ================= 报价填报 ================= */
let __pendingQuote=null;
function draftKey(no){ const m=me(); return 'draft|'+no+'|1|'+(m?m.supplierCode:''); }
function RfqForm(props){
  useChannel('inquiries'); useChannel('mDrafts');
  const q=(store.inquiries||[]).find(function(x){ return x.applyNo===props.params.no; });
  const m=me()||{};
  const [lines,setLines]=useState(null);
  const [hadDraft,setHadDraft]=useState(false);
  const [validUntil,setValidUntil]=useState('');
  const [quoteDesc,setQuoteDesc]=useState('');
  const [fileName,setFileName]=useState('');
  const [errIdx,setErrIdx]=useState(-1); const [errMsg,setErrMsg]=useState('');
  const lineRefs=useRef({});
  useEffect(function(){
    if(!q || lines) return;
    const dk=draftKey(q.applyNo);
    const d=(store.mDrafts||[]).find(function(x){ return x.key===dk; });
    if(d && d.data){
      setLines(d.data.lines); setValidUntil(d.data.validUntil||''); setQuoteDesc(d.data.quoteDesc||''); setFileName(d.data.fileName||'');
      setHadDraft(true); toast('已恢复上次暂存的草稿');
      return;
    }
    setLines((q.contentItems||[]).map(function(it){ return { key:it.key, materialCode:it.materialCode, materialName:it.materialName, spec:it.spec, unit:it.unit, qty:it.qty, expectDate:it.expectDate, availableQty:String(it.qty), price:'', taxRate:13, deliveryDate:it.expectDate }; }));
    setValidUntil(dayjs().add(90,'day').format('YYYY-MM-DD'));
  },[q]);
  if(!q) return <div className="page"><StatusBar/><TopBar title="填报报价"/><Empty text="未找到询价单"/></div>;
  if((q.invited||[]).indexOf(me().supplierCode)<0) return <Deny/>;
  if(!lines) return <div className="page"><StatusBar/><TopBar title="填报报价"/><Empty text="加载中…"/></div>;
  const total=lines.reduce(function(s,r){ return s+parseAmount(r.price)*parseAmount(r.qty); },0);
  const filled=lines.filter(function(r){ return r.price!==''&&r.price!=null; }).length;
  function setLine(i,k,v){ setLines(lines.map(function(r,j){ return j===i? Object.assign({},r,(function(o){ o[k]=v; return o; })({})) : r; })); setErrIdx(-1); setErrMsg(''); }
  function saveDraft(silent){
    const dk=draftKey(q.applyNo);
    const rest=(store.mDrafts||[]).filter(function(x){ return x.key!==dk; });
    setChannel('mDrafts', rest.concat([{ key:dk, inquiryNo:q.applyNo, supplierCode:m.supplierCode, data:{ lines:lines, validUntil:validUntil, quoteDesc:quoteDesc, fileName:fileName }, time:nowStr() }]));
    if(!silent) toast('草稿已暂存');
  }
  function submit(){
    if(!lines.length){ toast('本单没有可报价的物料行'); return; }
    for(let i=0;i<lines.length;i++){ const r=lines[i];
      if(r.price===''||r.price==null){ setErrIdx(i); setErrMsg('请填写含税单价'); const el=lineRefs.current[i]; if(el) el.scrollIntoView({behavior:'smooth',block:'center'}); return; }
      if(parseAmount(r.price)<=0){ setErrIdx(i); setErrMsg('含税单价需大于 0'); const el2=lineRefs.current[i]; if(el2) el2.scrollIntoView({behavior:'smooth',block:'center'}); return; }
    }
    if(!validUntil){ toast('请选择报价有效期'); return; }
    if(dayjs(validUntil).isBefore(dayjs(q.round1Deadline),'day')){ toast('报价有效期早于报价截止时间，请调整'); return; }
    const cq=canQuoteInquiry(q); if(!cq.ok){ toast(cq.reason); return; }
    if(!canWrite()) return;
    __pendingQuote={ inquiryNo:q.applyNo, round:1, lines:lines, validUntil:validUntil, quoteDesc:quoteDesc, fileName:fileName };
    nav('/m/rfq/confirm?no='+q.applyNo);
  }
  return (<div className="page has-footer">
    <StatusBar/><TopBar title="填报报价" onBack={function(){ saveDraft(true); window.history.back(); }} right={<span onClick={function(){ saveDraft(); }}>暂存</span>}/>
    <IdWatermark/>
    <div className="notice-bar notice-info" style={{margin:'10px 12px 0'}}><span>i</span><span>{q.projectName} · 第 1 轮 · 截止 {q.round1Deadline}</span></div>
    <div className="card" style={{position:'sticky',top:0,zIndex:6}}>
      <div className="row-between">
        <span className="fs13 muted2">已填 {filled} / {lines.length} 行</span>
        <span className="fs13">本轮合计 <span className="money">¥ {fmtMoney(total)}</span></span>
      </div>
      {hadDraft? <div className="row-between mt6">
        <span className="fs11" style={{color:'#ad6800'}}>已恢复上次暂存的草稿</span>
        <span className="fs11" style={{color:'var(--brand)'}} onClick={function(){
          setChannel('mDrafts',(store.mDrafts||[]).filter(function(x){ return x.key!==draftKey(q.applyNo); }));
          setLines((q.contentItems||[]).map(function(it){ return { key:it.key, materialCode:it.materialCode, materialName:it.materialName, spec:it.spec, unit:it.unit, qty:it.qty, expectDate:it.expectDate, availableQty:String(it.qty), price:'', taxRate:13, deliveryDate:it.expectDate }; }));
          setQuoteDesc(''); setFileName(''); setValidUntil(dayjs().add(90,'day').format('YYYY-MM-DD')); setHadDraft(false); toast('已清空草稿，重新填写');
        }}>清空草稿重填</span>
      </div> : null}
    </div>
    {lines.map(function(r,i){ const lineAmt=parseAmount(r.price)*parseAmount(r.qty); const shortQty=parseAmount(r.availableQty)<parseAmount(r.qty); const lateDelivery=r.deliveryDate && r.expectDate && dayjs(r.deliveryDate).isAfter(dayjs(r.expectDate),'day');
      return (<div key={r.key||i} className="card" ref={function(el){ lineRefs.current[i]=el; }} style={errIdx===i?{boxShadow:'0 0 0 2px var(--error)'}:null}>
        <div className="row-between"><span className="fs15 fw600">{i+1}. {r.materialName}</span><span className="fs12 muted">{r.materialCode}</span></div>
        <div className="fs12 muted mt4">{r.spec} · 需求 {r.qty} {r.unit} · 要求交期 {r.expectDate}</div>
        <div className="field mt10"><div className="field-label">含税单价（元） <span className="req">*</span></div>
          <NumInput err={errIdx===i} placeholder="必填" value={r.price} onChange={function(v){ setLine(i,'price',v); }}/>
          {errIdx===i&&errMsg? <div className="field-err">{errMsg}</div> : null}</div>
        <div className="row-between" style={{gap:10}}>
          <div className="field" style={{flex:1}}><div className="field-label">可供数量 <span className="req">*</span></div>
            <NumInput value={r.availableQty} onChange={function(v){ setLine(i,'availableQty',v); }}/></div>
          <div className="field" style={{flex:1}}><div className="field-label">税率 <span className="req">*</span></div>
            <div className="input select-fake" onClick={function(){ pickerSheet('选择税率', TAX_RATES.map(function(t){ return {value:t,label:taxLabel(t)}; }), r.taxRate, function(v){ setLine(i,'taxRate',v); }); }}>{taxLabel(r.taxRate)}</div></div>
        </div>
        <div className="field"><div className="field-label">承诺交期 <span className="req">*</span></div>
          <input className="input" type="date" value={r.deliveryDate||''} onChange={function(e){ setLine(i,'deliveryDate',e.target.value); }}/></div>
        {shortQty? <div className="notice-bar notice-warn" style={{margin:'0 0 8px'}}><span>!</span><span>可供数量不足需求数量，采购方会在中标页标红提示。</span></div> : null}
        {lateDelivery? <div className="notice-bar notice-err" style={{margin:'0 0 8px'}}><span>!</span><span>承诺交期晚于采购要求交期，可能影响评审。</span></div> : null}
        <div className="row-between"><span className="fs12 muted">行金额（单价 × 需求数量）</span><span className="money normal">¥ {fmtMoney(lineAmt)}</span></div>
      </div>); })}
    <Section>单据信息</Section>
    <div className="card">
      <div className="field"><div className="field-label">报价有效期至 <span className="req">*</span></div>
        <input className="input" type="date" value={validUntil} onChange={function(e){ setValidUntil(e.target.value); }}/></div>
      <div className="field"><div className="field-label">报价说明</div>
        <textarea className="input" placeholder="如：含运费含税到货价 / 付款条件偏离说明" value={quoteDesc} onChange={function(e){ setQuoteDesc(e.target.value); }}/></div>
      <div className="field" style={{marginBottom:0}}><div className="field-label">报价附件</div>
        <label className="input select-fake" style={{display:'flex',color:fileName?'var(--text)':'var(--text-4)'}}>
          {fileName||'拍照 / 从相册选择（可选）'}
          <input type="file" accept="image/*,.pdf" capture="environment" style={{display:'none'}} onChange={function(e){ const f=e.target.files&&e.target.files[0]; if(f) setFileName(f.name); }}/>
        </label></div>
    </div>
    <FixedFooter>
      <button className="btn btn-plain" onClick={function(){ saveDraft(); }}>暂存草稿</button>
      <button className="btn btn-primary" onClick={submit}>提交报价</button>
    </FixedFooter>
  </div>);
}

/* ================= 提交确认 ================= */
function RfqConfirm(props){
  useChannel('quotes');
  const [agree,setAgree]=useState(false); const [done,setDone]=useState(null);
  const p=__pendingQuote;
  const q=(store.inquiries||[]).find(function(x){ return x.applyNo===((p&&p.inquiryNo)||props.params.no); });
  const total=p? p.lines.reduce(function(s,r){ return s+parseAmount(r.price)*parseAmount(r.qty); },0) : 0;
  const exTax=p? p.lines.reduce(function(s,r){ return s+parseAmount(r.price)*parseAmount(r.qty)/(1+parseAmount(r.taxRate)/100); },0) : 0;
  function doSubmit(){
    const row={ key:genKey('q'), inquiryNo:p.inquiryNo, supplier:me().supplierName, supplierCode:me().supplierCode, round:p.round, price:Math.round(total*100)/100, quoteTime:nowStr().slice(0,16), quoteStatus:'已报价',
      lines:p.lines, validUntil:p.validUntil, quoteDesc:p.quoteDesc, file:p.fileName||'' };
    appendRow('quotes',row);
    setChannel('mDrafts',(store.mDrafts||[]).filter(function(x){ return x.key!==draftKey(p.inquiryNo); }));
    logAction('供应商报价','提交报价',p.inquiryNo,me().supplierName+' 合计 '+fmtMoney(total));
    pushNotify('寻源','success','报价已提交','已对 '+p.inquiryNo+' 提交第 '+p.round+' 轮报价，合计 '+fmtMoney(total)+' 元','#/m/rfq/records');

        <div className="fs12" style={{color:'var(--text-4)'}}>采购端「供应商报价单 / 智能比价」刷新后可见</div>
        <div style={{display:'flex',gap:10,marginTop:16}}>
          <button className="btn btn-ghost" style={{height:44}} onClick={function(){ nav('/m/rfq/records'); }}>查看我的报价</button>
          <button className="btn btn-primary" style={{height:44}} onClick={function(){ nav('/m/home'); }}>返回首页</button>
        </div>
      </div>
    </div>);
  }
  if(!p || p.inquiryNo!==props.params.no) return <div className="page"><StatusBar/><TopBar title="提交确认"/><Empty text="没有待确认的报价" sub="请从询价详情进入填报"/></div>;
  return (<div className="page has-footer">
    <StatusBar/><TopBar title="提交确认"/>
    <IdWatermark/>
    <div className="card">
      <div className="card-title">{q? q.projectName : p.inquiryNo} <Tag color="processing">第{p.round}轮</Tag></div>
      {p.lines.map(function(r,i){ return (<div key={i} className="row-between" style={{padding:'7px 0',borderBottom:'.5px solid var(--line)'}}>
        <div><div className="fs13 fw600">{r.materialName}</div><div className="fs12 muted">¥{fmtMoney(r.price)} × {r.qty}{r.unit} · 税率 {taxLabel(r.taxRate)}</div></div>
        <span className="money normal fs14">¥ {fmtMoney(parseAmount(r.price)*parseAmount(r.qty))}</span>
      </div>); })}
      <div className="mt10">
        <div className="row-between fs13" style={{padding:'3px 0'}}><span className="muted">不含税合计</span><span>¥ {fmtMoney(exTax)}</span></div>
        <div className="row-between fs13" style={{padding:'3px 0'}}><span className="muted">税额</span><span>¥ {fmtMoney(total-exTax)}</span></div>
        <div className="row-between" style={{padding:'6px 0'}}><span className="fs14 fw600">含税合计</span><span className="money big">¥ {fmtMoney(total)}</span></div>
        <div className="fs12 muted">大写：{moneyCN(total)}</div>
      </div>
      <div className="dl mt10">

      我已阅读并同意采购方的报价规则，确认本次报价真实有效，提交后截止前可撤回重报。

/* ================= 我的报价记录 ================= */
function RfqRecords(){
  const quotes=useChannel('quotes'); useChannel('inquiries');
  const [seg,setSeg]=useState('all');
  const m=me()||{};
  const mine=(quotes||[]).filter(function(q){ return q.supplierCode===m.supplierCode && String(q.inquiryNo||'').indexOf('JJ')!==0; });
  /* 同单多轮聚合为一组 */
  const groups={};
  mine.forEach(function(r){ const k=r.inquiryNo; if(!groups[k]) groups[k]=[]; groups[k].push(r); });
  let glist=Object.keys(groups).map(function(k){
    const rows=groups[k].slice().sort(function(a,b){ return (b.round||0)-(a.round||0); });
    return { no:k, rows:rows, latest:rows[0] };
  });
  glist.sort(function(a,b){ return String(b.latest.quoteTime||'').localeCompare(String(a.latest.quoteTime||'')); });
  if(seg!=='all') glist=glist.filter(function(g){ return g.rows.some(function(r){ return r.quoteStatus===seg; }); });
  function withdraw(g){
    const q=(store.inquiries||[]).find(function(x){ return x.applyNo===g.no; });
    if(q && leftInfo(q.round1Deadline).expired){ toast('已过截止时间，不可撤回'); return; }
    confirmSheet({ title:'撤回本轮报价', body:'撤回后本轮需重新报价，采购端将显示「已撤回」。是否继续？', danger:true, okText:'撤回', onOk:function(){
      const target=g.rows.find(function(r){ return r.quoteStatus==='已报价'; });
      if(!target) return;
      updateRow('quotes',target.key,{ quoteStatus:'已撤回' });
      logAction('供应商报价','撤回报价',g.no,me().supplierName+' 撤回第 '+target.round+' 轮报价');
      pushNotify('寻源','warning','报价已撤回',g.no+' 第 '+target.round+' 轮报价已撤回，可在截止前重新报价','#/m/rfq/records');
      toast('已撤回，可在截止前重新报价');
    }});
  }
  return (<div className="page has-tabbar">
    <StatusBar/><TopBar title="我的报价记录"/>
    <IdWatermark/>
    <BizTabs value="rfq"/>
    <SegTabs value={seg} onChange={setSeg} options={[
      { value:'all', label:'全部' },{ value:'已报价', label:'已报价' },{ value:'已驳回', label:'已驳回' },{ value:'已撤回', label:'已撤回' },{ value:'逾期', label:'其它' },
    ]}/>
    {glist.map(function(g){
      const q=(store.inquiries||[]).find(function(x){ return x.applyNo===g.no; });
      const canWd=g.rows.some(function(r){ return r.quoteStatus==='已报价'; }) && q && !leftInfo(q.round1Deadline).expired;
      return (<div key={g.no} className="card">

function myBiddings(){ const m=me(); if(!m) return []; return (store.biddings||[]).filter(function(b){ return (b.suppliers||[]).indexOf(m.supplierName)>=0; }); }
function bidEndOf(b){ if(b.endsAt) return b.endsAt; const c=parseT(b.createdAt); return c? c.add(b.duration||30,'minute').format('YYYY-MM-DD HH:mm:ss') : ''; }
function bidQuotesOf(no){ return (store.quotes||[]).filter(function(q){ return q.inquiryNo===no; }); }
function bidCurrent(b){
  const qs=bidQuotesOf(b.biddingNo).filter(function(q){ return q.quoteStatus==='已报价'; });
  if(!qs.length) return { price:parseAmount(b.startPrice), count:0 };
  const prices=qs.map(function(q){ return parseAmount(q.price); });
  return { price: b.biddingRule==='forward'? Math.max.apply(null,prices) : Math.min.apply(null,prices), count:qs.length };
}
function BiddingList(){
  useChannel('biddings'); useChannel('quotes');

  if(seg==='done') list=rows.filter(function(b){ return b.status!=='竞价中'&&b.status!=='已暂停'; });
  return (<div className="page has-tabbar">
    <StatusBar/><TopBar title="竞价大厅" back={false}/>
    <IdWatermark/>
    <BizTabs value="bidding"/>
    <SegTabs value={seg} onChange={setSeg} options={[{value:'run',label:'进行中',count:rows.filter(function(b){return b.status==='竞价中';}).length},{value:'done',label:'已结束'},{value:'all',label:'全部'}]}/>
    {list.map(function(b){ const cur=bidCurrent(b);
      return (<div key={b.key} className="biz-card" onClick={function(){ nav('/m/bidding/detail?no='+b.biddingNo); }}>
        <div className="biz-top"><div className="biz-title">{b.projectName}</div><StatusTag v={b.status}/></div>
        <div className="biz-meta"><span>单号 <b>{b.biddingNo}</b></span><span>{b.method}</span><span>起始价 <b>¥{fmtMoney(b.startPrice)}</b></span></div>

          <span className="fs12">当前{(b.biddingRule==='forward'?'最高价':'最低价')} <b style={{color:'#d4380d'}}>¥{fmtMoney(cur.price)}</b> · {cur.count} 笔出价</span>
          {b.status==='竞价中'? <Countdown target={bidEndOf(b)} fast/> : <span className="fs12" style={{color:'var(--text-4)'}}>{b.status==='已暂停'?('暂停：'+(b.pauseReason||'')):''}</span>}

}

function BiddingRoom(props){
  useChannel('biddings'); useChannel('quotes');
  const [,forceTick]=useState(0);
  useEffect(function(){ const t=setInterval(function(){ forceTick(function(x){ return x+1; }); },1000); return function(){ clearInterval(t); }; },[]);
  const b=(store.biddings||[]).find(function(x){ return x.biddingNo===props.params.no; });
  const m=me()||{};
  if(!b) return <div className="page"><StatusBar/><TopBar title="竞价间"/><Empty text="未找到竞价场次"/></div>;
  if((b.suppliers||[]).indexOf(m.supplierName)<0) return <Deny/>;
  const cfg=((store.biddingConfig||[])[0])||{ delayWindow:30, delayExtend:30 };
  const reverse=b.biddingRule!=='forward';
  const cur=bidCurrent(b);
  const myBids=bidQuotesOf(b.biddingNo).filter(function(q){ return q.supplierCode===m.supplierCode && q.quoteStatus==='已报价'; });
  const allBids=bidQuotesOf(b.biddingNo).filter(function(q){ return q.quoteStatus==='已报价'; }).slice().sort(function(a,b2){ return String(a.quoteTime).localeCompare(String(b2.quoteTime)); });
  const li=leftInfo(bidEndOf(b));
  const ended=li.expired || b.status==='已结束' || b.status==='流标' || b.status==='废标' || b.status==='已终止';
  const paused=b.status==='已暂停';
  const myLatest=myBids.length? parseAmount(myBids[myBids.length-1].price) : null;
  const myRank=allBids.length? (reverse? allBids.slice().sort(function(a,b2){ return parseAmount(a.price)-parseAmount(b2.price); }) : allBids.slice().sort(function(a,b2){ return parseAmount(b2.price)-parseAmount(a.price); })).findIndex(function(q){ return q.supplierCode===m.supplierCode; })+1 : 0;
  const suggest=reverse? cur.price-parseAmount(b.minDrop) : cur.price+parseAmount(b.minDrop);
  const [val,setVal]=useState('');
  useEffect(function(){ setVal(String(suggest.toFixed(2))); },[b.biddingNo, cur.price, cur.count]);
  function submit(){
    if(!canWrite()) return;
    if(paused){ toast('竞价已暂停：'+(b.pauseReason||'')+'，暂停期间禁止出价'); return; }
    if(ended){ toast('竞价已结束'); return; }
    const v=parseAmount(val);
    if(!v || v<=0){ toast('请输入有效出价'); return; }
    if(reverse && v>cur.price-parseAmount(b.minDrop)+1e-9){ toast('需低于 ¥'+fmtMoney(cur.price-parseAmount(b.minDrop))+'（当前最低价 ¥'+fmtMoney(cur.price)+'，最小降幅 ¥'+fmtMoney(b.minDrop)+'）'); return; }
    if(!reverse && v<cur.price+parseAmount(b.minDrop)-1e-9){ toast('需高于 ¥'+fmtMoney(cur.price+parseAmount(b.minDrop))+'（当前最高价 ¥'+fmtMoney(cur.price)+'，最小加价 ¥'+fmtMoney(b.minDrop)+'）'); return; }
    appendRow('quotes',{ key:genKey('q'), inquiryNo:b.biddingNo, supplier:m.supplierName, supplierCode:m.supplierCode, round:1, price:v, quoteTime:nowStr().slice(0,16), quoteStatus:'已报价' });
    /* 延时规则：截止前 delayWindow 秒内有出价则延长 delayExtend 秒 */
    const endMs=(parseT(bidEndOf(b))||dayjs()).valueOf();
    if(endMs-Date.now() <= cfg.delayWindow*1000){
      updateRow('biddings', b.key, function(r){ return { endsAt: dayjs(endMs).add(cfg.delayExtend,'second').format('YYYY-MM-DD HH:mm:ss') }; });
      toast('出价成功 ¥'+fmtMoney(v)+' · 触发延时 +'+cfg.delayExtend+' 秒');
    } else toast('出价成功 ¥'+fmtMoney(v));
    logAction('竞价大厅','出价',b.biddingNo,m.supplierName+' 出价 '+fmtMoney(v));
    pushNotify('竞价','info','出价成功','你在 '+b.biddingNo+' 出价 ¥'+fmtMoney(v),'#/m/bidding/room?no='+b.biddingNo);
  }
  return (<div className="page has-footer">
    <StatusBar/><TopBar title={'竞价间 '+(b.biddingNo)}/>
    <IdWatermark/>
    <div className="bid-hero">
      <div className="fs12" style={{opacity:.75}}>{b.method} · {paused?'已暂停':ended?'已结束':'剩余时间'}</div>
      <div className={'bid-clock'+(li.urgent&&!ended?' urgent':'')}>{paused?'已暂停':ended?'--:--':clockText(li.ms)}</div>
      <div className="bid-price">当前{reverse?'最低价':'最高价'} <b>¥ {fmtMoney(cur.price)}</b></div>
      <div className="fs12" style={{opacity:.7,marginTop:6}}>起始价 ¥{fmtMoney(b.startPrice)} · 最小{reverse?'降':'加'}幅 ¥{fmtMoney(b.minDrop)} · 共 {cur.count} 笔出价 · 参与 {(b.suppliers||[]).length} 家</div>
    </div>
    {paused? <div className="notice-bar notice-warn"><span>Ⅱ</span><span>采购方已暂停本场竞价{ b.pauseReason?('：'+b.pauseReason):'' }，恢复前禁止出价。</span></div> : null}
    {ended? <div className="notice-bar notice-info"><span>i</span><span>本场竞价已结束。最终价 ¥{fmtMoney(cur.price)}{myRank?('，你的位次 第'+myRank+' 名'):''}。</span></div> : null}
    <div className="card">
      <div className="card-title">我的出价 {myLatest!=null? <span className="more">我的最新 ¥{fmtMoney(myLatest)}{myRank?(' · 第 '+myRank+' 名'):''}</span> : null}</div>
      <div className="stepper">
        <button onClick={function(){ setVal(function(v){ const nv=parseAmount(v)+(reverse?-1:1)*parseAmount(b.minDrop); return (nv>0?nv:0).toFixed(2); }); }}>{reverse?'−':'＋'}</button>
        <NumInput value={val} onChange={setVal}/>
        <button onClick={function(){ setVal(function(v){ const nv=parseAmount(v)+(reverse?1:-1)*parseAmount(b.minDrop); return (nv>0?nv:0).toFixed(2); }); }}>{reverse?'＋':'−'}</button>
      </div>
      <div className="fs12 muted mt8">建议出价（当前价 {reverse?'−':'＋'} 最小幅度）：¥ {fmtMoney(suggest)}</div>
      <button className="btn btn-primary" style={{width:'100%',marginTop:12}} disabled={paused||ended} onClick={submit}>{paused?'已暂停 · 禁止出价':ended?'竞价已结束':'确认出价'}</button>
    </div>
    <Section>我的出价记录（{myBids.length}）</Section>
    <div className="card" style={{paddingTop:6,paddingBottom:6}}>
      {myBids.slice().reverse().map(function(q,i){ return (<div key={q.key} className="menu-cell" style={{padding:'10px 2px'}}>
        <span className="fs13">第 {myBids.length-i} 笔</span>
        <span className="money normal fs14">¥ {fmtMoney(q.price)}</span>
        <span className="fs12 muted">{q.quoteTime}</span>
      </div>); })}
      {!myBids.length? <div className="fs13 muted" style={{padding:'12px 0'}}>还没有出价</div> : null}
    </div>
  </div>);
}

function TenderSecond(props){
  useChannel('tenders'); useChannel('quotes');

  const m=me()||{};
  const [v,setV]=useState('');

  const r1=(store.quotes||[]).find(function(q){ return q.inquiryNo===t.tenderNo && q.supplierCode===m.supplierCode && q.round===1; });
  const r2=(store.quotes||[]).find(function(q){ return q.inquiryNo===t.tenderNo && q.supplierCode===m.supplierCode && q.round===2; });

    pushNotify('招标','success','二次报价已提交',t.tenderNo+' 二轮报价 ¥'+fmtMoney(pv),'#/m/tender/detail?no='+t.tenderNo);

function DepositPay(props){
  useChannel('deposits');
  const m=me()||{};
  const d=(store.deposits||[]).find(function(x){ return x.key===props.params.key; });
  const [voucherNo,setVoucherNo]=useState(''); const [amount,setAmount]=useState(d? String(d.amount):'');

  if(!d) return <div className="page"><StatusBar/><TopBar title="上传缴纳凭证"/><Empty text="未找到记录"/></div>;
  if(d.supplierCode!==m.supplierCode) return <Deny/>;
  const diff=Math.abs(parseAmount(amount)-parseAmount(d.amount))>0.005;
  function submit(){

    updateRow('deposits', d.key, { payStatus:'已缴纳', voucherNo:voucherNo.trim(), payTime:nowStr(), payAmount:parseAmount(amount), payerName:payer, voucherFile:fileName });
    logAction('保证金','上传缴纳凭证',d.tenderNo,me().supplierName+' 凭证 '+voucherNo.trim());
    pushNotify('寻源','info','保证金凭证已提交',d.tenderNo+' 已上传 ¥'+fmtMoney(amount)+' 缴纳凭证，等待采购方确认到账','#/m/profile/deposit');
    toast('已提交，等待采购方确认到账');
    window.history.back();
  }
  return (<div className="page has-footer">
    <StatusBar/><TopBar title="上传缴纳凭证"/>
    <IdWatermark/>
    <div className="card">
      <div className="row-between"><span className="fs14 fw600">{d.projectName}</span><span className="money">¥ {fmtMoney(d.amount)}</span></div>
      <div className="fs12 muted mt4">{d.tenderNo}</div>

        <input className="input" value={voucherNo} onChange={function(e){ setVoucherNo(e.target.value); }} placeholder="银行回单上的流水号"/></div>
      <div className="field"><div className="field-label">转账金额（元） <span className="req">*</span></div>
        <NumInput value={amount} onChange={setAmount}/>
        {diff? <div className="field-err">与应缴金额 ¥{fmtMoney(d.amount)} 不一致，请核对</div> : null}</div>
      <div className="field"><div className="field-label">付款日期 <span className="req">*</span></div>
        <input className="input" type="date" value={payDate} onChange={function(e){ setPayDate(e.target.value); }}/></div>
      <div className="field"><div className="field-label">付款账户名</div>
        <input className="input" value={payer} onChange={function(e){ setPayer(e.target.value); }}/></div>
      <div className="field" style={{marginBottom:0}}><div className="field-label">回单照片</div>
        <label className="input select-fake" style={{display:'flex',color:fileName?'var(--text)':'var(--text-4)'}}>
          {fileName||'拍照 / 从相册选择（可选）'}
          <input type="file" accept="image/*" capture="environment" style={{display:'none'}} onChange={function(e){ const f=e.target.files&&e.target.files[0]; if(f) setFileName(f.name); }}/>
        </label></div>
    </div>
    <FixedFooter><button className="btn btn-primary" onClick={submit}>提交凭证</button></FixedFooter>
  </div>);
}

/* ================= 订单 ================= */
function OrderList(){
  useChannel('orders');
  const [seg,setSeg]=useState('todo');
  const m=me()||{};
  const rows=(store.orders||[]).filter(function(o){ return o.supplier===m.supplierName; });
  let list=rows;
  if(seg==='todo') list=rows.filter(function(o){ return o.status==='待供应商确认'; });
  if(seg==='run') list=rows.filter(function(o){ return o.status==='供应商已确认'||o.status==='执行中'; });
  if(seg==='done') list=rows.filter(function(o){ return o.status==='已完成'||o.status==='已取消'||o.status==='已拒绝'; });
  return (<div className="page has-tabbar">
    <StatusBar/><TopBar title="采购订单" back={false}/>
    <IdWatermark/>
    <DocTabs value="order"/>
    <SegTabs value={seg} onChange={setSeg} options={[
      { value:'todo', label:'待确认', count:rows.filter(function(o){return o.status==='待供应商确认';}).length },
      { value:'run', label:'执行中' },{ value:'done', label:'已完结' },{ value:'all', label:'全部' },
    ]}/>
    {list.map(function(o){
      return (<div key={o.key} className="biz-card" onClick={function(){ nav('/m/order/detail?no='+o.orderNo); }}>
        <div className="biz-top"><div className="biz-title">{o.orderNo}</div><StatusTag v={o.status}/></div>
        <div className="biz-meta"><span>下单 <b>{o.orderDate}</b></span><span>要求交期 <b>{o.deliveryDate}</b></span><span>来源 <b>{o.sourceDocType||'—'}</b></span></div>
        <div className="biz-foot"><span className="fs13">订单金额 <span className="money">¥ {fmtMoney(o.amount)}</span></span>
          {o.status==='待供应商确认'? <Tag color="warning">待你确认</Tag> : <span className="fs12 muted">›</span>}</div>
      </div>); })}
    {!list.length? <Empty text="暂无订单"/> : null}
    <div style={{height:70}}></div>
  </div>);
}
function OrderDetail(props){
  useChannel('orders'); useChannel('appointments'); useChannel('notices'); useChannel('receipts'); useChannel('inspections'); useChannel('warehouses');
  const o=(store.orders||[]).find(function(x){ return x.orderNo===props.params.no; });
  const m=me()||{};
  if(!o) return <div className="page"><StatusBar/><TopBar title="订单详情"/><Empty text="未找到订单"/></div>;
  if(o.supplier!==m.supplierName) return <Deny/>;
  const addr=(store.addresses||[]).find(function(a){ return a.isDefault; })||{};
  const appt=(store.appointments||[]).filter(function(a){ return a.orderNo===o.orderNo; });
  const nts=(store.notices||[]).filter(function(n){ return n.orderNo===o.orderNo; });
  const rcv=(store.receipts||[]).filter(function(r){ return r.orderNo===o.orderNo; });
  const insp=(store.inspections||[]).filter(function(r){ return r.orderNo===o.orderNo; });
  const wh=(store.warehouses||[]).filter(function(r){ return r.orderNo===o.orderNo; });
  const steps=['待供应商确认','供应商已确认','执行中','已完成'];
  const curIdx=o.status==='草稿'?0:steps.indexOf(o.status);
  const rejected=o.status==='已拒绝'||o.status==='已取消';
  function confirm(){
    if(!canWrite()) return;
    confirmSheet({ title:'确认接单', body:'确认后订单进入「执行中」，请按约定交期组织生产与发货。', onOk:function(){
      updateRow('orders', o.key, { status:'供应商已确认', confirmTime:nowStr() });
      logAction('采购订单','确认接单',o.orderNo,m.supplierName);
      pushNotify('履约','success','订单已确认',o.orderNo+' 已确认接单，请及时安排交付','#/m/order/detail?no='+o.orderNo);
      toast('已确认接单');
    }});
  }
  function reject(){
    if(!canWrite()) return;
    inputSheet({ title:'拒绝订单', label:'拒绝原因', placeholder:'请说明拒绝原因（至少 10 个字）', minLen:10, onOk:function(text){
      updateRow('orders', o.key, { status:'已拒绝', rejectReason:text });
      logAction('采购订单','拒绝订单',o.orderNo,m.supplierName+'：'+text);
      toast('已拒绝该订单，原因已回写采购端');
    }});
  }
  return (<div className="page has-footer">
    <StatusBar/><TopBar title="订单详情"/>
    <IdWatermark/>
    <div className="card">
      <div className="biz-top"><div className="biz-title">{o.orderNo}</div><StatusTag v={o.status}/></div>
      <div className="dl" style={{marginTop:6}}>
        <FieldRow label="订单金额" value={'¥ '+fmtMoney(o.amount)}/>
        <FieldRow label="下单日期" value={o.orderDate}/>
        <FieldRow label="要求交期" value={o.deliveryDate}/>
        <FieldRow label="关联合同" value={o.contractNo}/>
        <FieldRow label="来源单据" value={(o.sourceDocNo||'—')+(o.sourceDocType?'（'+o.sourceDocType+'）':'')}/>
      </div>
      {o.rejectReason? <div className="notice-bar notice-err" style={{margin:'8px 0 0'}}><span>!</span><span>已拒绝：{o.rejectReason}</span></div> : null}
    </div>
    <Section>执行进度</Section>
    <div className="card">
      {rejected? <div className="notice-bar notice-err" style={{margin:0}}><span>!</span><span>订单{o.status}，流程终止。</span></div> : (<div className="tl">
        {steps.map(function(s,i){
          const done=curIdx>i, cur=curIdx===i;
          return (<div key={s} className={'tl-item'+(done?' done':cur?' cur':'')}>
            <div className="tl-line"></div><div className="tl-dot"></div>
            <div className="tl-body"><div className="t">{s}</div>
              {i===1&&o.confirmTime? <div className="d">{o.confirmTime}</div> : null}
              {i===2&&cur? <div className="d">请在 {o.deliveryDate} 前完成交付</div> : null}
            </div>
          </div>); })}
      </div>)}
    </div>
    <Section>收货信息</Section>
    <div className="card"><div className="dl">
      <FieldRow label="收货人" value={addr.receiver}/><FieldRow label="联系电话" value={addr.phone}/>
      <FieldRow label="收货地址" value={(addr.region||'')+(addr.address||'')} full/>
    </div></div>
    <Section>交付记录</Section>
    <div className="card fs13">
      <div className="row-between" style={{padding:'6px 0'}}><span>送货预约</span><span className="muted">{appt.length? appt.map(function(a){ return a.appointNo+'（'+a.status+'）'; }).join('；') : '暂无'}</span></div>
      <div className="row-between" style={{padding:'6px 0'}}><span>发货通知</span><span className="muted">{nts.length? nts.map(function(n){ return n.noticeNo; }).join('；') : '暂无'}</span></div>
      <div className="row-between" style={{padding:'6px 0'}}><span>收货确认</span><span className="muted">{rcv.length? rcv.map(function(r){ return r.receiptNo+'（实收 '+r.actualQty+'）'; }).join('；') : '暂无'}</span></div>
      <div className="row-between" style={{padding:'6px 0'}}><span>质检验收</span><span className="muted">{insp.length? insp.map(function(r){ return r.inspectNo+'（'+(r.conclusion||'待检')+'）'; }).join('；') : '暂无'}</span></div>
      <div className="row-between" style={{padding:'6px 0'}}><span>采购入库</span><span className="muted">{wh.length? wh.map(function(r){ return r.warehouseNo+'（'+r.qty+' 入库）'; }).join('；') : '暂无'}</span></div>
    </div>
    <FixedFooter>
      {o.status==='待供应商确认'? (<React.Fragment>
        <button className="btn btn-plain" onClick={reject}>拒绝订单</button>
        <button className="btn btn-primary" onClick={confirm}>确认接单</button>
      </React.Fragment>) : (o.status==='供应商已确认'||o.status==='执行中')? (<React.Fragment>
        <button className="btn btn-ghost" onClick={function(){ nav('/m/deliver/change?orderNo='+o.orderNo); }}>申请交期变更</button>
        <button className="btn btn-primary" onClick={function(){ nav('/m/deliver/notice?orderNo='+o.orderNo); }}>发货通知</button>
      </React.Fragment>) : <button className="btn btn-plain" onClick={function(){ window.history.back(); }}>返回</button>}
    </FixedFooter>
  </div>);
}

/* ================= 交付：交期变更 / 送货预约 / 发货通知 / 跟踪 ================= */
function DeliverTabs(props){
  return <SegTabs value={props.value} options={[
    { value:'track', label:'进度跟踪', to:'/m/deliver/track' },
    { value:'appoint', label:'送货预约', to:'/m/deliver/appoint' },
    { value:'notice', label:'发货通知', to:'/m/deliver/notice' },
    { value:'change', label:'交期变更', to:'/m/deliver/change' },
  ]}/>;
}
function myActiveOrders(){ const m=me()||{}; return (store.orders||[]).filter(function(o){ return o.supplier===m.supplierName && (o.status==='供应商已确认'||o.status==='执行中'); }); }
function DeliverChange(props){
  useChannel('deliveryChanges');
  const m=me()||{};
  const fixedOrder=props.params.orderNo||'';
  const orders=myActiveOrders();
  const [orderNo,setOrderNo]=useState(fixedOrder);
  const [newDate,setNewDate]=useState(''); const [reason,setReason]=useState(''); const [desc,setDesc]=useState('');
  const myRows=(store.deliveryChanges||[]).filter(function(c){ return (store.orders||[]).some(function(o){ return o.orderNo===c.orderNo && o.supplier===m.supplierName; }); });
  const selOrder=(store.orders||[]).find(function(o){ return o.orderNo===orderNo; });
  function submit(){
    if(!canWrite()) return;
    if(!orderNo){ toast('请选择订单'); return; }
    if(!selOrder || selOrder.supplier!==m.supplierName){ toast('该订单不属于当前供应商'); return; }
    if(!newDate){ toast('请选择新交期'); return; }
    if(selOrder && dayjs(newDate).isSame(dayjs(selOrder.deliveryDate),'day')){ toast('新交期与原交期相同'); return; }
    if(reason.trim().length<5){ toast('请填写变更原因（至少 5 个字）'); return; }
    appendRow('deliveryChanges',{ key:genKey('dc'), changeNo:'BG'+dayjs().format('YYYYMMDDHHmmss'), orderNo:orderNo, origDate:selOrder?selOrder.deliveryDate:'', newDate:newDate, reason:reason.trim(), description:desc.trim(), applicant:m.supplierName, status:'待审批', applyTime:nowStr() });
    logAction('交期变更','发起申请',orderNo,m.supplierName+' 申请 '+ (selOrder?selOrder.deliveryDate:'') +' → '+newDate);
    pushNotify('履约','info','交期变更已申请',orderNo+' 新交期 '+newDate+'，待采购方审批','#/m/deliver/change');
    toast('已提交，待采购方审批');
    setReason(''); setDesc(''); setNewDate('');
  }
  return (<div className="page has-tabbar">
    <StatusBar/><TopBar title="交期变更" back={!fixedOrder}/>
    <IdWatermark/>
    {!fixedOrder? <DocTabs value="deliver"/> : null}
    {!fixedOrder? <DeliverTabs value="change"/> : null}
    <div className="card">
      <div className="field"><div className="field-label">订单 <span className="req">*</span></div>
        {fixedOrder? <input className="input ro" disabled value={fixedOrder}/> :
          <div className="input select-fake" onClick={function(){ pickerSheet('选择订单', orders.map(function(o){ return { value:o.orderNo, label:o.orderNo+'（¥'+fmtMoney(o.amount)+'）' }; }), orderNo, setOrderNo); }}>{orderNo||'请选择执行中的订单'}</div>}
      </div>
      <div className="field"><div className="field-label">原交期</div><input className="input ro" disabled value={selOrder? selOrder.deliveryDate : '—'}/></div>
      <div className="field"><div className="field-label">新交期 <span className="req">*</span></div>
        <input className="input" type="date" value={newDate} onChange={function(e){ setNewDate(e.target.value); }}/></div>
      <div className="field"><div className="field-label">变更原因 <span className="req">*</span></div>
        <input className="input" value={reason} onChange={function(e){ setReason(e.target.value); }} placeholder="如：原材料到货延迟"/></div>
      <div className="field" style={{marginBottom:0}}><div className="field-label">补充说明</div>
        <textarea className="input" value={desc} onChange={function(e){ setDesc(e.target.value); }}/></div>
      <button className="btn btn-primary" style={{width:'100%',marginTop:6}} onClick={submit}>提交申请</button>
    </div>
    <Section>我的变更记录</Section>
    {myRows.map(function(c){ return (<div key={c.key} className="biz-card">
      <div className="biz-top"><div className="biz-title">{c.changeNo}</div><StatusTag v={c.status}/></div>
      <div className="biz-meta"><span>订单 <b>{c.orderNo}</b></span><span>{c.origDate} → <b>{c.newDate}</b></span></div>
      <div className="fs12 muted mt4">原因：{c.reason}{c.approver?(' · 审批人 '+c.approver):''}</div>
    </div>); })}
    {!myRows.length? <Empty text="暂无变更记录"/> : null}
    <div style={{height:70}}></div>
  </div>);
}
function DeliverAppoint(props){
  useChannel('appointments');
  const m=me()||{};
  const orders=myActiveOrders();
  const [orderNo,setOrderNo]=useState(props.params.orderNo||'');
  const [date,setDate]=useState(''); const [qty,setQty]=useState(''); const [contact,setContact]=useState(m.contact||''); const [phone,setPhone]=useState('');
  const [plate,setPlate]=useState(''); const [warehouse,setWarehouse]=useState('北京主仓'); const [remark,setRemark]=useState('');
  const myRows=(store.appointments||[]).filter(function(a){ return a.supplier===m.supplierName; });
  function submit(){
    if(!canWrite()) return;
    if(!orderNo){ toast('请选择订单'); return; }
    const owner=(store.orders||[]).find(function(x){ return x.orderNo===orderNo; });
    if(!owner || owner.supplier!==m.supplierName){ toast('该订单不属于当前供应商'); return; }
    if(myRows.some(function(a){ return a.orderNo===orderNo && a.status==='待确认'; })){ toast('该订单已有在途预约，请等待采购方确认'); return; }
    if(!date){ toast('请选择预约到仓日期'); return; }
    appendRow('appointments',{ key:genKey('a'), appointNo:'YY'+dayjs().format('YYYYMMDDHHmmss'), orderNo:orderNo, supplier:m.supplierName, appointDate:date, arrivalQty:qty, warehouse:warehouse, contact:contact, phone:phone, plate:plate, remark:remark, status:'待确认' });
    logAction('送货预约','新建预约',orderNo,m.supplierName+' 预约 '+date);
    pushNotify('履约','info','送货预约已提交',orderNo+' 预约 '+date+' 到仓，待采购方确认','#/m/deliver/appoint');
    toast('预约已提交，待采购方确认');
    setDate(''); setQty(''); setPlate(''); setRemark('');
  }
  return (<div className="page has-tabbar">
    <StatusBar/><TopBar title="送货预约" back={false}/>
    <IdWatermark/>
    <DocTabs value="deliver"/>
    <DeliverTabs value="appoint"/>
    <div className="card">
      <div className="field"><div className="field-label">订单 <span className="req">*</span></div>
        <div className="input select-fake" onClick={function(){ pickerSheet('选择订单', orders.map(function(o){ return { value:o.orderNo, label:o.orderNo }; }), orderNo, setOrderNo); }}>{orderNo||'请选择执行中的订单'}</div></div>
      <div className="row-between" style={{gap:10}}>
        <div className="field" style={{flex:1}}><div className="field-label">预约到仓日期 <span className="req">*</span></div>
          <input className="input" type="date" value={date} onChange={function(e){ setDate(e.target.value); }}/></div>
        <div className="field" style={{flex:1}}><div className="field-label">到货数量</div>
          <NumInput value={qty} onChange={setQty}/></div>
      </div>
      <div className="field"><div className="field-label">收货仓库</div>
        <div className="input select-fake" onClick={function(){ pickerSheet('选择仓库', ['北京主仓','上海分仓','天津分仓'], warehouse, setWarehouse); }}>{warehouse}</div></div>
      <div className="row-between" style={{gap:10}}>
        <div className="field" style={{flex:1}}><div className="field-label">司机/联系人</div><input className="input" value={contact} onChange={function(e){ setContact(e.target.value); }}/></div>
        <div className="field" style={{flex:1}}><div className="field-label">联系电话</div><input className="input" inputMode="tel" value={phone} onChange={function(e){ setPhone(e.target.value); }}/></div>
      </div>
      <div className="field"><div className="field-label">车牌号</div><input className="input" value={plate} onChange={function(e){ setPlate(e.target.value.toUpperCase()); }} placeholder="如 京A12345"/></div>
      <div className="field" style={{marginBottom:0}}><div className="field-label">备注</div><input className="input" value={remark} onChange={function(e){ setRemark(e.target.value); }}/></div>
      <button className="btn btn-primary" style={{width:'100%',marginTop:6}} onClick={submit}>提交预约</button>
    </div>
    <Section>我的预约</Section>
    {myRows.map(function(a){ return (<div key={a.key} className="biz-card">
      <div className="biz-top"><div className="biz-title">{a.appointNo}</div><StatusTag v={a.status}/></div>
      <div className="biz-meta"><span>订单 <b>{a.orderNo}</b></span><span>到仓 <b>{a.appointDate}</b></span><span>仓库 <b>{a.warehouse}</b></span>{a.plate? <span>车牌 <b>{a.plate}</b></span>:null}</div>
    </div>); })}
    {!myRows.length? <Empty text="暂无预约记录"/> : null}
    <div style={{height:70}}></div>
  </div>);
}
function DeliverNotice(props){
  useChannel('notices');
  const m=me()||{};
  const orders=myActiveOrders();
  const [orderNo,setOrderNo]=useState(props.params.orderNo||'');
  const [shipDate,setShipDate]=useState(todayStr()); const [company,setCompany]=useState('顺丰速运'); const [logisticsNo,setLogisticsNo]=useState('');
  const [arrive,setArrive]=useState(''); const [remark,setRemark]=useState('');
  const myRows=(store.notices||[]).filter(function(n){ return n.supplier===m.supplierName; });
  function submit(){
    if(!canWrite()) return;
    if(!orderNo){ toast('请选择订单'); return; }
    const owner=(store.orders||[]).find(function(x){ return x.orderNo===orderNo; });
    if(!owner || owner.supplier!==m.supplierName){ toast('该订单不属于当前供应商'); return; }
    if(!logisticsNo.trim()){ toast('请填写物流单号'); return; }
    appendRow('notices',{ key:genKey('n'), noticeNo:'TZ'+dayjs().format('YYYYMMDDHHmmss'), orderNo:orderNo, supplier:m.supplierName, shipDate:shipDate, logisticsCompany:company, logisticsNo:logisticsNo.trim(), logistics:company+' '+logisticsNo.trim(), expectArrive:arrive, remark:remark, status:'已发送' });
    logAction('送货通知','发货',orderNo,m.supplierName+' 发货 '+company+' '+logisticsNo.trim());
    pushNotify('履约','info','发货通知已发送',orderNo+' 已发货，'+company+' '+logisticsNo.trim(),'#/m/deliver/notice');
    toast('发货通知已发送');
    setLogisticsNo(''); setRemark('');
  }
  return (<div className="page has-tabbar">
    <StatusBar/><TopBar title="发货通知" back={false}/>
    <IdWatermark/>
    <DocTabs value="deliver"/>
    <DeliverTabs value="notice"/>
    <div className="card">
      <div className="field"><div className="field-label">订单 <span className="req">*</span></div>
        <div className="input select-fake" onClick={function(){ pickerSheet('选择订单', orders.map(function(o){ return { value:o.orderNo, label:o.orderNo }; }), orderNo, setOrderNo); }}>{orderNo||'请选择执行中的订单'}</div></div>
      <div className="row-between" style={{gap:10}}>
        <div className="field" style={{flex:1}}><div className="field-label">发货日期</div><input className="input" type="date" value={shipDate} onChange={function(e){ setShipDate(e.target.value); }}/></div>
        <div className="field" style={{flex:1}}><div className="field-label">预计到达</div><input className="input" type="date" value={arrive} onChange={function(e){ setArrive(e.target.value); }}/></div>
      </div>
      <div className="field"><div className="field-label">物流公司</div>
        <div className="input select-fake" onClick={function(){ pickerSheet('选择物流公司', ['顺丰速运','京东物流','德邦物流','中通快运','跨越速运'], company, setCompany); }}>{company}</div></div>
      <div className="field"><div className="field-label">物流单号 <span className="req">*</span></div>
        <input className="input" value={logisticsNo} onChange={function(e){ setLogisticsNo(e.target.value); }} placeholder="如 SF1234567890"/></div>
      <div className="field" style={{marginBottom:0}}><div className="field-label">备注</div><input className="input" value={remark} onChange={function(e){ setRemark(e.target.value); }}/></div>
      <button className="btn btn-primary" style={{width:'100%',marginTop:6}} onClick={submit}>发送发货通知</button>
    </div>
    <Section>我的发货通知</Section>
    {myRows.map(function(n){ return (<div key={n.key} className="biz-card">
      <div className="biz-top"><div className="biz-title">{n.noticeNo}</div><StatusTag v={n.status}/></div>
      <div className="biz-meta"><span>订单 <b>{n.orderNo}</b></span><span>物流 <b>{n.logistics||n.logisticsNo}</b></span>{n.expectArrive? <span>预计到达 <b>{n.expectArrive}</b></span>:null}</div>
    </div>); })}
    {!myRows.length? <Empty text="暂无发货通知"/> : null}
    <div style={{height:70}}></div>
  </div>);
}
function DeliverTrack(){
  useChannel('receipts'); useChannel('inspections'); useChannel('warehouses'); useChannel('returns'); useChannel('orders');
  const m=me()||{};
  const myOrderNos=(store.orders||[]).filter(function(o){ return o.supplier===m.supplierName; }).map(function(o){ return o.orderNo; });
  const receipts=(store.receipts||[]).filter(function(r){ return r.supplier===m.supplierName || myOrderNos.indexOf(r.orderNo)>=0; });
  const inspections=(store.inspections||[]).filter(function(r){ return r.supplier===m.supplierName || myOrderNos.indexOf(r.orderNo)>=0; });
  const warehouses=(store.warehouses||[]).filter(function(r){ return r.supplier===m.supplierName || myOrderNos.indexOf(r.orderNo)>=0; });
  const returns=(store.returns||[]).filter(function(r){ return r.supplier===m.supplierName || myOrderNos.indexOf(r.orderNo)>=0; });
  const nothing=!receipts.length && !inspections.length && !warehouses.length && !returns.length;
  return (<div className="page has-tabbar">
    <StatusBar/><TopBar title="交付跟踪" back={false}/>
    <IdWatermark/>
    <DocTabs value="deliver"/>
    <DeliverTabs value="track"/>

function SettleTabs(props){
  return <SegTabs value={props.value} options={[
    { value:'recon', label:'对账', to:'/m/settle/recon', count:todoCounts().recon },
