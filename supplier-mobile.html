}
function SettleRecon(){
  useChannel('reconciliations');
  const [seg,setSeg]=useState('todo');
  const m=me()||{};
  const rows=(store.reconciliations||[]).filter(function(r){ return r.supplier===m.supplierName; });
  let list=rows;
  if(seg==='todo') list=rows.filter(function(r){ return r.status==='待确认'; });
  if(seg==='done') list=rows.filter(function(r){ return r.status!=='待确认'; });
  function confirmRecon(r){
    if(!canWrite()) return;
    confirmSheet({ title:'确认对账单', body:'确认 '+r.reconcileNo+'（应付 ¥'+fmtMoney(r.netAmount)+'）？确认后可登记开票。', onOk:function(){
      updateRow('reconciliations', r.key, { status:'已确认', confirmTime:nowStr() });
      logAction('供应商对账','确认对账',r.reconcileNo,m.supplierName+' 确认应付 '+fmtMoney(r.netAmount));
      pushNotify('结算','success','对账已确认',r.reconcileNo+' 已确认，请及时开票','#/m/settle/recon');
      toast('对账已确认');
    }});
  }
  function diff(r){
    if(!canWrite()) return;
    inputSheet({ title:'提出对账差异', label:'差异说明', placeholder:'请说明差异点（至少 10 个字），采购方将复核', minLen:10, onOk:function(text){
      updateRow('reconciliations', r.key, { diffNote:text, diffFlag:true });
      logAction('供应商对账','提出差异',r.reconcileNo,m.supplierName+'：'+text);
      toast('差异已提交，采购方将复核');
    }});
  }
  return (<div className="page has-tabbar">
    <StatusBar/><TopBar title="供应商对账" back={false}/>
    <IdWatermark/>
    <DocTabs value="settle"/>
    <SettleTabs value="recon"/>
    <SegTabs value={seg} onChange={setSeg} options={[
      { value:'todo', label:'待确认', count:rows.filter(function(r){return r.status==='待确认';}).length },
      { value:'done', label:'已确认/结算' },{ value:'all', label:'全部' },
    ]}/>
    {list.map(function(r){
      function openDetail(){
        const notes=[];
        if(r.status==='待确认') notes.push({type:'notice-warn',icon:'!',text:'请核对账期与金额，确认后可登记开票；有差异请先提出差异。'});
        if(r.diffFlag) notes.push({type:'notice-warn',icon:'!',text:'已提交差异，等待采购方复核。'});
        if(r.invoiceStatus==='有差异') notes.push({type:'notice-err',icon:'!',text:'发票与对账单存在差额：¥'+fmtMoney(r.diffAmount||0)+'，请联系采购方处理。'});
        openSheet({ kind:'info', title:'对账详情', rows:[
          ['对账单号', r.reconcileNo], ['状态', r.status],
          ['账期', r.period], ['订单张数', r.orderCount+' 张'],
          ['生成时间', r.createTime], ['确认时间', r.confirmTime||'—'],
          ['应付总额', '¥ '+fmtMoney(r.grossAmount)], ['扣款金额', '¥ '+fmtMoney(r.deductAmount)],
          ['实付净额', '¥ '+fmtMoney(r.netAmount)], ['发票状态', r.invoiceStatus||'待登记'],
          ['发票号', r.invoiceNo||'—'], ['开票金额', r.invoiceAmount!=null? '¥ '+fmtMoney(r.invoiceAmount):'—'],
          ['开票日期', r.invoiceDate||'—'], ['验真时间', r.verifyTime||'—'],
          ['差异说明', r.diffNote||'无', true],
        ], notes:notes,
          footer: (r.status==='已确认'&&r.invoiceStatus==='待登记')? { text:'去登记发票', onClick:function(){ nav('/m/settle/invoice?key='+r.key); } } : null });
      }
      return (<div key={r.key} className="biz-card" onClick={openDetail}>
        <div className="biz-top"><div className="biz-title">{r.reconcileNo}</div><StatusTag v={r.status}/></div>
        <div className="biz-meta"><span>账期 <b>{r.period}</b></span><span>订单 <b>{r.orderCount}</b> 张</span><span>生成 <b>{r.createTime}</b></span></div>
        <div className="card" style={{margin:'10px 0 0',padding:'10px 12px',background:'#fafbfc',boxShadow:'none'}}>
          <div className="row-between fs13" style={{padding:'3px 0'}}><span className="muted">应付总额</span><span>¥ {fmtMoney(r.grossAmount)}</span></div>
          <div className="row-between fs13" style={{padding:'3px 0'}}><span className="muted">扣款</span><span style={{color:'var(--error)'}}>- ¥ {fmtMoney(r.deductAmount)}</span></div>
          <div className="row-between" style={{padding:'5px 0 0'}}><span className="fs13 fw600">实付净额</span><span className="money">¥ {fmtMoney(r.netAmount)}</span></div>
        </div>
        <div className="row-between fs12 muted mt8"><span>发票状态</span><StatusTag v={r.invoiceStatus||'待登记'}/></div>
        {r.invoiceNo? <div className="fs12 muted mt4">发票 {r.invoiceNo} · ¥{fmtMoney(r.invoiceAmount)} · {r.invoiceDate}{r.verifyTime?(' · 验真 '+r.verifyTime):''}</div> : null}
        {r.diffFlag? <div className="notice-bar notice-warn" style={{margin:'8px 0 0'}}><span>!</span><span>我方差异：{r.diffNote}</span></div> : null}
        {r.status==='待确认'? <div className="biz-foot">
          <button className="btn btn-plain btn-sm" onClick={function(ev){ ev.stopPropagation(); diff(r); }}>提出差异</button>
          <button className="btn btn-primary btn-sm" onClick={function(ev){ ev.stopPropagation(); confirmRecon(r); }}>确认对账</button>
        </div> : null}
        {r.status==='已确认' && r.invoiceStatus==='待登记'? <div className="biz-foot">
          <span className="fs12 muted">对账已确认，请登记发票</span>
          <button className="btn btn-primary btn-sm" onClick={function(ev){ ev.stopPropagation(); nav('/m/settle/invoice?key='+r.key); }}>开票登记</button>
        </div> : null}
        {r.status!=='待确认' && !(r.status==='已确认'&&r.invoiceStatus==='待登记')? <div className="biz-foot"><span className="fs12" style={{color:'var(--text-4)'}}>点击卡片查看对账详情 ›</span></div> : null}
      </div>); })}
    {!list.length? <Empty text="暂无对账单"/> : null}
    <div style={{height:70}}></div>
  </div>);
}
function SettleInvoice(props){
  useChannel('reconciliations');
  const r=(store.reconciliations||[]).find(function(x){ return x.key===props.params.key; });
  const [invoiceNo,setInvoiceNo]=useState(''); const [amount,setAmount]=useState(r? String(r.netAmount):'');
  const [invoiceDate,setInvoiceDate]=useState(todayStr()); const [fileName,setFileName]=useState('');
  if(!r) return <div className="page"><StatusBar/><TopBar title="开票登记"/><Empty text="未找到对账单"/></div>;
  if(r.supplier!==(me()||{}).supplierName) return <Deny/>;
  const diff=Math.abs(parseAmount(amount)-parseAmount(r.netAmount))>0.005;
  function submit(){
    if(!canWrite()) return;
    if(!invoiceNo.trim()){ toast('请填写发票号'); return; }
    if(!invoiceDate){ toast('请选择开票日期'); return; }
    updateRow('reconciliations', r.key, { invoiceStatus:'已登记', invoiceNo:invoiceNo.trim(), invoiceAmount:parseAmount(amount), invoiceDate:invoiceDate, invoiceFile:fileName });
    logAction('开票登记','登记发票',r.reconcileNo,invoiceNo.trim()+' ¥'+fmtMoney(amount));
    pushNotify('结算','success','发票已登记',r.reconcileNo+' 发票 '+invoiceNo.trim()+' 已登记，等待采购方验真','#/m/settle/recon');
    toast('发票已登记，等待采购方验真');
    window.history.back();
  }
  return (<div className="page has-footer">
    <StatusBar/><TopBar title="开票登记"/>
    <IdWatermark/>
    <div className="card">
      <div className="row-between"><span className="fs14 fw600">{r.reconcileNo}</span><span className="money">应开 ¥ {fmtMoney(r.netAmount)}</span></div>
      <div className="fs12 muted mt4">账期 {r.period} · 发票类型以询价单约定为准（增值税专用发票）</div>
    </div>
    <div className="card">

        <input className="input" value={invoiceNo} onChange={function(e){ setInvoiceNo(e.target.value); }} placeholder="如 FP20260315001"/></div>
      <div className="field"><div className="field-label">开票金额（元） <span className="req">*</span></div>
        <NumInput value={amount} onChange={setAmount}/>
        {diff? <div className="field-err">与应付净额 ¥{fmtMoney(r.netAmount)} 不一致，请核对</div> : null}</div>
      <div className="field"><div className="field-label">开票日期 <span className="req">*</span></div>
        <input className="input" type="date" value={invoiceDate} onChange={function(e){ setInvoiceDate(e.target.value); }}/></div>
      <div className="field" style={{marginBottom:0}}><div className="field-label">发票照片</div>
        <label className="input select-fake" style={{display:'flex',color:fileName?'var(--text)':'var(--text-4)'}}>
          {fileName||'拍照 / 从相册选择（可选）'}
          <input type="file" accept="image/*,.pdf" capture="environment" style={{display:'none'}} onChange={function(e){ const f=e.target.files&&e.target.files[0]; if(f) setFileName(f.name); }}/>
        </label></div>
    </div>
    <FixedFooter><button className="btn btn-primary" onClick={submit}>登记发票</button></FixedFooter>
  </div>);
}

  const [diag,setDiag]=useState(null);
  function runDiag(){
    const dev=document.getElementById('device'); const page=document.querySelector('.page'); const tb=document.querySelector('.tabbar');
    const r=el=>{ if(!el) return null; const b=el.getBoundingClientRect(); return {top:Math.round(b.top),bottom:Math.round(b.bottom),h:Math.round(b.height),w:Math.round(b.width)}; };
    const dr=r(dev), tbr=r(tb), pr=r(page);
    let hit='—', hitDesc='—';
    if(tbr){ const cx=(tbr.left+tbr.right)/2, cy=(tbr.top+tbr.bottom)/2; const el=document.elementFromPoint(cx,cy);
      if(el){ hit=el.tagName.toLowerCase()+'.'+(el.className&&typeof el.className==='string'?el.className.trim().replace(/\s+/g,'.'):''); hitDesc = tb.contains(el)? '✅ 命中 TabBar 本身' : ('❌ 被 '+hit+' 挡住了点击'); } }
    setDiag({ inner: window.innerWidth+'×'+window.innerHeight+(window.visualViewport?('（可见 '+Math.round(window.visualViewport.width)+'×'+Math.round(window.visualViewport.height)+'）'):''),
      device: dr? (dr.w+'×'+dr.h+' top='+dr.top+' bottom='+dr.bottom) : '—',
      scroll: page? ('可视高 '+pr.h+' / 内容高 '+(page.scrollHeight||0)+(page.scrollHeight>(page.clientHeight+4)?' → 需内部滚动':' → 无需滚动')) : '—',
      tabbar: tbr? ('top='+tbr.top+' bottom='+tbr.bottom) : '—',
      hit: hitDesc });
  }
  const [prefs,setPrefs]=useState(function(){ const a=(store.mAccounts||[]).find(function(x){ return x.supplierCode===m.supplierCode; }); return (a&&a.notifyPrefs)||{ '寻源':true,'履约':true,'结算':true,'系统':true }; });
  function togglePref(k){
    const next=Object.assign({},prefs,(function(o){ o[k]=!prefs[k]; return o; })({}));
    setPrefs(next);
    setChannel('mAccounts',(store.mAccounts||[]).map(function(x){ return x.supplierCode===m.supplierCode? Object.assign({},x,{notifyPrefs:next}) : x; }));
  }
  function doChangePwd(){
    const a=(store.mAccounts||[]).find(function(x){ return x.supplierCode===m.supplierCode; });
    if(!a) return;
    if(pwdForm.old!==a.password){ toast('原密码错误'); return; }
    if(pwdForm.n1.length<8){ toast('新密码至少 8 位'); return; }
    if(pwdForm.n1!==pwdForm.n2){ toast('两次新密码不一致'); return; }
    setChannel('mAccounts',(store.mAccounts||[]).map(function(x){ return x.supplierCode===m.supplierCode? Object.assign({},x,{password:pwdForm.n1}) : x; }));
    logAction('账号设置','修改密码','',m.supplierName);
    toast('密码已修改');
    setPwdForm(null);
  }
  function switchAccount(){ clearSession(); nav('/m/login'); window.location.hash='#/m/login'; window.location.reload(); }
  function logout(){
    confirmSheet({ title:'退出登录', body:'退出后需重新登录才能操作业务。', danger:true, okText:'退出', onOk:function(){
      clearSession(); window.location.hash='#/m/login'; window.location.reload();
    }});
  }
  function resetDemo(){
    confirmSheet({ title:'重置演示数据', body:'将清除手机端产生的全部数据（报价、出价、凭证等）并恢复初始种子，采购端共享仓同步还原。', danger:true, okText:'重置', onOk:function(){
      try{ localStorage.removeItem(LS_KEY); localStorage.removeItem(SES_LS); sessionStorage.removeItem(SES_LS); }catch(e){}
      window.location.hash='#/m/login'; window.location.reload();
    }});
  }
  return (<div className="page">
    <StatusBar/><TopBar title="账号设置"/>
    <IdWatermark/>
    <div className="card">
      <div className="menu-cell" style={{borderBottom:'.5px solid var(--line)'}}><span>登录账号</span><span className="muted fs13">{m.phone||'—'}（{m.supplierCode}）</span></div>
      <div className="menu-cell" onClick={function(){ setPwdForm(pwdForm? null : { old:'', n1:'', n2:'' }); }}><span>修改登录密码</span><span className="mc-arrow"></span></div>
      {pwdForm? (<div style={{padding:'10px 0'}}>
        <div className="field"><input className="input" type="password" placeholder="原密码" value={pwdForm.old} onChange={function(e){ setPwdForm(Object.assign({},pwdForm,{old:e.target.value})); }}/></div>
        <div className="field"><input className="input" type="password" placeholder="新密码（至少 8 位）" value={pwdForm.n1} onChange={function(e){ setPwdForm(Object.assign({},pwdForm,{n1:e.target.value})); }}/></div>
        <div className="field"><input className="input" type="password" placeholder="再次输入新密码" value={pwdForm.n2} onChange={function(e){ setPwdForm(Object.assign({},pwdForm,{n2:e.target.value})); }}/></div>
        <button className="btn btn-primary btn-sm" style={{width:'100%'}} onClick={doChangePwd}>确认修改</button>
      </div>) : null}
    </div>
    <Section>通知开关（站内）</Section>
    <div className="card">
      {Object.keys(prefs).map(function(k){ return (<div key={k} className="menu-cell" onClick={function(){ togglePref(k); }}>
        <span>{k}类通知</span>
        <span style={{width:44,height:26,borderRadius:13,background:prefs[k]?'var(--brand)':'#d0d5dd',position:'relative',transition:'.15s',display:'inline-block'}}>
          <span style={{position:'absolute',top:3,left:prefs[k]?21:3,width:20,height:20,borderRadius:'50%',background:'#fff',transition:'.15s',boxShadow:'0 1px 3px rgba(0,0,0,.2)'}}></span>
        </span>
      </div>); })}
    </div>
    <Section>演示辅助</Section>
    <div className="card">
      <div className="menu-cell" onClick={runDiag}><span>屏幕自检（点不到时看这里）</span><span className="mc-arrow"></span></div>
      <div className="menu-cell" onClick={switchAccount}><span>切换账号</span><span className="mc-arrow"></span></div>
      <div className="menu-cell" onClick={resetDemo}><span style={{color:'var(--error)'}}>重置演示数据</span><span className="mc-arrow"></span></div>
    </div>
    {diag? (<div className="card" style={{fontSize:12,lineHeight:1.9}}>
      <div className="card-title">自检结果</div>
      <div>视口：{diag.inner}</div>
      <div>手机框：{diag.device}</div>
      <div>页面滚动：{diag.scroll}</div>
      <div>底部 Tab：{diag.tabbar}</div>
      <div>Tab 中心点接收者：{diag.hit}</div>
      <div className="fs11 muted mt6">截图这一页发给我即可定位问题。</div>
    </div>) : null}
    <div className="card"><button className="btn btn-danger" style={{width:'100%'}} onClick={logout}>退出登录</button></div>
  </div>);
}

/* ================= App 根组件 ================= */
const ROUTES={
  '/m/register':Register,
  '/m/home':Home,
  '/m/rfq/list':RfqList, '/m/rfq/detail':RfqDetail, '/m/rfq/form':RfqForm, '/m/rfq/confirm':RfqConfirm, '/m/rfq/records':RfqRecords,
  '/m/bidding/list':BiddingList, '/m/bidding/detail':BiddingDetail, '/m/bidding/room':BiddingRoom,
  '/m/tender/list':TenderList, '/m/tender/detail':TenderDetail, '/m/tender/second':TenderSecond,
  '/m/result/win':ResultWin, '/m/result/publicity':ResultPublicity, '/m/result/signup':ResultSignup,
  '/m/order/list':OrderList, '/m/order/detail':OrderDetail,
  '/m/deliver/track':DeliverTrack, '/m/deliver/appoint':DeliverAppoint, '/m/deliver/notice':DeliverNotice, '/m/deliver/change':DeliverChange,
  '/m/contract/list':ContractList, '/m/contract/detail':ContractDetail,
  '/m/settle/recon':SettleRecon, '/m/settle/invoice':SettleInvoice, '/m/settle/pay':SettlePay, '/m/settle/deduct':SettleDeduct,
  '/m/price/list':PriceList,
  '/m/notice':NoticeCenter,
  '/m/profile':ProfileHome, '/m/profile/company':ProfileCompany, '/m/profile/cert':ProfileCert, '/m/profile/perf':ProfilePerf,
  '/m/profile/deposit':DepositPage, '/m/profile/deposit/pay':DepositPay, '/m/profile/settings':ProfileSettings,
};
const TAB_PATHS=['/m/home','/m/rfq/list','/m/bidding/list','/m/tender/list','/m/result/win','/m/result/publicity','/m/result/signup','/m/rfq/records','/m/order/list','/m/deliver/track','/m/deliver/appoint','/m/deliver/notice','/m/deliver/change','/m/contract/list','/m/settle/recon','/m/settle/pay','/m/settle/deduct','/m/price/list','/m/notice','/m/profile'];
function App(){
  const route=useRoute();
  const [authTick,setAuthTick]=useState(0);
  useEffect(function(){ const h=function(){ setAuthTick(function(t){ return t+1; }); }; window.addEventListener('m-auth',h); return function(){ window.removeEventListener('m-auth',h); }; },[]);
  const session=getSession();
  const isLogin=!session;
  let body;
  if(isLogin && route.path!=='/m/register') body=<Login/>;
  else {
    const View=ROUTES[route.path];
    body=View? <View params={route.params}/> : <div className="page"><StatusBar/><TopBar title="页面不存在"/><Empty text="未找到页面" sub={route.path}/></div>;
  }
  const showTab=!isLogin && TAB_PATHS.indexOf(route.path)>=0;
  return (<React.Fragment>
    {body}
    {showTab? <TabBar path={route.path}/> : null}
    <SheetHost/>
    <ToastHost/>
  </React.Fragment>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
/* 手机壳/全屏切换 */
(function(){
  const btn=document.getElementById('frameToggle'), device=document.getElementById('device');
  btn.addEventListener('click',function(){
    const full=device.classList.toggle('full');
    btn.textContent=full?'手机壳预览':'全屏预览';
    document.querySelector('.stage').style.padding=full?'0':'';
  });
})();
